.micro-disclaimer { font-size: 12px; color: var(--gray); margin-top: 14px; line-height: 1.5; }

/* Scheduling */
.book-header { font-size: 18px; font-weight: 700; color: var(--navy-dark); margin: 26px 0 14px; }
.cal-frame {
  width: 100%; height: 620px; border: 1px solid var(--line); border-radius: 14px; background: var(--white);
}
.book-fallback { font-size: 13px; color: var(--gray); margin-top: 12px; }
.alt-actions { display: grid; gap: 10px; margin-top: 18px; }

/* ---- Footer ---- */
footer { background: var(--navy-dark); color: var(--cream); padding: 28px 20px; text-align: center; }
footer .f-inner { max-width: 660px; margin: 0 auto; }
footer .names { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
footer .disc { font-size: 12px; color: rgba(250,246,235,0.75); line-height: 1.6; }
footer a { color: var(--gold-soft); }
footer .f-links { margin-top: 12px; font-size: 12px; }

/* Hide helper */
[hidden] { display: none !important; }
</style>
</head>
<body>
<a href="#main" class="skip-link" id="skipLink">Pular para o conteúdo</a>

<!-- ============================ TOP BAR ============================ -->
<header class="topbar">
  <div class="brand">
    <img id="brandImg" src="" alt="Rodrigo DeOliveira" />
    <div class="brand-text">
      <strong>Rodrigo DeOliveira</strong>
      <span>NMLS #1435896 · Ideal Lending</span>
    </div>
  </div>
  <button class="lang-btn" id="langBtn" type="button" aria-label="Switch language">EN</button>
</header>

<main id="main">
  <!-- ============================ HERO ============================ -->
  <section class="section-navy hero" id="heroSection">
    <div class="inner">
      <span class="badge" id="heroBadge"></span>
      <h1 id="heroTitle"></h1>
      <p class="sub" id="heroSub"></p>
      <button class="btn-primary" id="heroCta" type="button"></button>
    </div>
  </section>

  <!-- ======================= HOW IT WORKS ========================= -->
  <section class="section-navy how" id="howSection" style="padding-top:0;">
    <div class="inner">
      <h2 id="howTitle"></h2>
      <div class="how-grid" id="howGrid"></div>
    </div>
  </section>

  <!-- ============================ QUIZ =========================== -->
  <section class="section-cream" id="quizSection">
    <div class="quiz-wrap">
      <div class="card" id="quizCard" aria-live="polite">
        <!-- rendered by JS -->
      </div>
    </div>
  </section>

  <!-- =========================== RESULT ========================== -->
  <section class="section-cream" id="resultSection" hidden>
    <div class="quiz-wrap">
      <div class="card result-card" id="resultCard" aria-live="polite">
        <!-- rendered by JS -->
      </div>
    </div>
  </section>
</main>

<!-- ============================ FOOTER ============================ -->
<footer>
  <div class="f-inner">
    <p class="names">Rodrigo DeOliveira · NMLS #1435896 &nbsp;|&nbsp; Ideal Lending LLC · NMLS #2471779</p>
    <p class="disc" id="footerDisc"></p>
    <p class="f-links"><a id="footerPrivacy" href="" target="_blank" rel="noopener"></a></p>
  </div>
</footer>

<script>
/* =========================================================================
   HELPERS
   ========================================================================= */
function t(key) { return UI[state.lang][key]; }
function L(obj) { return obj[state.lang]; } // localized field of a data object
function el(id) { return document.getElementById(id); }
function fmt(str, ...args) { return str.replace(/\{(\d+)\}/g, (_, i) => args[i]); }

/* =========================================================================
   SCORING — pure function over answers. gate ⛔ > review ⚠️ > strong ✅.
   Options without a tag (income, price, timeline) don't affect the tier.
   ========================================================================= */
function computeTier(answers) {
  let hasGate = false, hasReview = false;
  for (const q of QUIZ) {
    if (q.type !== "single") continue;
    const val = answers[q.key];
    if (!val) continue;
    const opt = q.options.find(o => o.value === val);
    if (!opt || !opt.tag) continue;
    if (opt.tag === "gate") hasGate = true;
    else if (opt.tag === "review") hasReview = true;
  }
  if (hasGate) return "C";
  if (hasReview) return "B";
  return "A";
}

/* =========================================================================
   STATIC CHROME RENDER (hero, how-it-works, footer, top bar)
   ========================================================================= */
function renderChrome() {
  document.documentElement.lang = state.lang;
  el("brandImg").src = CONFIG.loHeadshot;
  el("langBtn").textContent = t("langSwitch");
  el("langBtn").setAttribute("aria-label", state.lang === "pt" ? "Switch to English" : "Mudar para Português");
  el("skipLink").textContent = state.lang === "pt" ? "Pular para o conteúdo" : "Skip to content";

  el("heroBadge").textContent = t("heroBadge");
  el("heroTitle").innerHTML = t("heroTitle");
  el("heroSub").textContent = t("heroSub");
  el("heroCta").textContent = t("heroCta");

  el("howTitle").textContent = t("howTitle");
  el("howGrid").innerHTML = t("howSteps").map((s, i) =>
    `<div class="how-card"><div class="how-num">${i + 1}</div><p>${s}</p></div>`
  ).join("");

  el("footerDisc").textContent = t("footerDisclosure");
  const priv = el("footerPrivacy");
  priv.textContent = t("footerPrivacy");
  priv.href = CONFIG.privacyPolicyUrl;
}

/* =========================================================================
   QUIZ RENDER
   ========================================================================= */
function renderStep() {
  const idx = state.step;              // 1-based into QUIZ
  const q = QUIZ[idx - 1];
  const total = QUIZ.length;
  const pct = Math.round((idx / total) * 100);
  const card = el("quizCard");
  const isLast = idx === total;

  let body;
  if (q.type === "single") {
    body = renderSingle(q);
  } else if (q.type === "form") {
    body = renderForm(q);
  }

  const nextLabel = isLast ? t("seeResult") : t("next");

  card.innerHTML = `
    <div class="progress-meta">
      <span>${fmt(t("stepOf"), idx, total)}</span>
      <span>${pct}%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    ${body}
    <div class="err" id="stepErr" role="alert" aria-live="assertive"></div>
    <div class="nav-row">
      <button class="btn-secondary" id="backBtn" type="button" ${idx === 1 ? "disabled" : ""}>${t("back")}</button>
      <button class="btn-primary" id="nextBtn" type="button">${nextLabel}</button>
    </div>
  `;

  wireStep(q, isLast);

  // Move keyboard focus to the question for screen-reader users.
  const focusTarget = card.querySelector(".q-title");
  if (focusTarget) { focusTarget.setAttribute("tabindex", "-1"); focusTarget.focus({ preventScroll: true }); }
}

function renderSingle(q) {
  const useGrid = q.key === "state";
  const opts = q.options.map(o => {
    const selected = state.answers[q.key] === o.value ? "selected" : "";
    const checked = state.answers[q.key] === o.value ? "checked" : "";
    return `
      <label class="opt ${selected}" data-value="${o.value}">
        <input type="radio" name="${q.key}" value="${o.value}" ${checked} />
        <span class="mark" aria-hidden="true"></span>
        <span class="lbl">${L(o)}</span>
      </label>`;
  }).join("");
  return `
    <fieldset>
      <legend>${L(q)}</legend>
      <h2 class="q-title">${L(q)}</h2>
      <div class="options ${useGrid ? "grid2" : ""}">${opts}</div>
    </fieldset>`;
}

function renderForm(q) {
  const c = state.contact;
  const fields = q.fields.map(f => {
    if (f.type === "radio") {
      const opts = f.options.map(o => {
        const sel = (c[f.name] || state.lang.toUpperCase()) === o.value ? "selected" : "";
        const chk = (c[f.name] || state.lang.toUpperCase()) === o.value ? "checked" : "";
        return `<label class="opt ${sel}" data-value="${o.value}">
                  <input type="radio" name="${f.name}" value="${o.value}" ${chk} />
                  <span class="mark" aria-hidden="true"></span>
                  <span class="lbl">${L(o)}</span>
                </label>`;
      }).join("");
      return `<div class="field"><label>${L(f)}</label><div class="radio-row">${opts}</div></div>`;
    }
    const val = c[f.name] ? c[f.name].replace(/"/g, "&quot;") : "";
    return `<div class="field">
      <label for="f_${f.name}">${L(f)}${f.required ? " *" : ""}</label>
      <input id="f_${f.name}" name="${f.name}" type="${f.type}" value="${val}"
             autocomplete="${f.autocomplete || "off"}" ${f.required ? "required" : ""} />
    </div>`;
  }).join("");
  return `<h2 class="q-title">${L(q)}</h2>${fields}`;
}

/* =========================================================================
   STEP WIRING (selection, validation, navigation)
   ========================================================================= */
function wireStep(q, isLast) {
  const card = el("quizCard");

  // Radio selection (works for single-choice steps and the form's lang radio)
  card.querySelectorAll(".opt").forEach(opt => {
    opt.addEventListener("click", () => {
      const group = opt.querySelector("input").name;
      card.querySelectorAll(`.opt input[name="${group}"]`).forEach(i => {
        i.closest(".opt").classList.remove("selected");
      });
      opt.classList.add("selected");
      opt.querySelector("input").checked = true;
      clearErr();
    });
  });

  el("backBtn").addEventListener("click", goBack);
  el("nextBtn").addEventListener("click", () => goNext(q, isLast));

  // Enter advances on text inputs
  card.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"]').forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); goNext(q, isLast); } });
  });
}

function clearErr() { const e = el("stepErr"); if (e) e.textContent = ""; }
function showErr(msg) {
  const e = el("stepErr");
  if (e) { e.textContent = msg; }
}

function goBack() {
  if (state.step > 1) { state.step--; renderStep(); scrollQuizIntoView(); }
}

function goNext(q, isLast) {
  if (q.type === "single") {
    const checked = el("quizCard").querySelector(`input[name="${q.key}"]:checked`);
    if (!checked) { showErr(t("fieldErr")); return; }
    state.answers[q.key] = checked.value;
  } else if (q.type === "form") {
    if (!validateForm(q)) return;
  }

  if (isLast) {
    submitAndShowResult();
  } else {
    state.step++;
    renderStep();
    scrollQuizIntoView();
  }
}

function validateForm(q) {
  const card = el("quizCard");
  const data = {};
  for (const f of q.fields) {
    if (f.type === "radio") {
      const checked = card.querySelector(`input[name="${f.name}"]:checked`);
      if (!checked && f.required) { showErr(t("fieldErr")); return false; }
      if (checked) data[f.name] = checked.value;
      continue;
    }
    const inp = el("f_" + f.name);
    const val = (inp.value || "").trim();
    if (f.required && !val) {
      showErr(f.name === "name" ? t("nameErr") : t("fieldErr"));
      inp.focus();
      return false;
    }
    if (f.name === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
      showErr(t("emailErr")); inp.focus(); return false;
    }
    if (f.name === "phone" && val.replace(/\D/g, "").length < 7) {
      showErr(t("phoneErr")); inp.focus(); return false;
    }
    data[f.name] = val;
  }
  state.contact = data;
  return true;
}

function scrollQuizIntoView() {
  const target = state.view === "result" ? el("resultSection") : el("quizSection");
  target.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* =========================================================================
   LEAD CAPTURE — fires BEFORE the calendar. Never lose the lead.
   On success OR failure we still show the result + booking step.
   ========================================================================= */
function buildLeadPayload() {
  const payload = {
    _subject: "DreamBuilder lead — " + (state.contact.name || "(no name)"),
    name: state.contact.name || "",
    phone: state.contact.phone || "",
    email: state.contact.email || "",
    preferred_language: state.contact.pref_lang || state.lang.toUpperCase(),
    page_language: state.lang.toUpperCase(),
    tier: state.tier,
    program: "DreamBuilder",
  };
  // Include every quiz answer with a human-readable label (English, for the inbox).
  for (const q of QUIZ) {
    if (q.type !== "single") continue;
    const val = state.answers[q.key];
    if (!val) continue;
    const opt = q.options.find(o => o.value === val);
    payload["q_" + q.key] = opt ? opt.en : val;
    if (opt && opt.tag) payload["tag_" + q.key] = opt.tag;
  }
  return payload;
}

async function submitAndShowResult() {
  state.tier = computeTier(state.answers);

  // Lock the button and show a sending state.
  const nextBtn = el("nextBtn");
  if (nextBtn) { nextBtn.disabled = true; nextBtn.textContent = t("submitting"); }

  const payload = buildLeadPayload();

  // POST the lead FIRST. Graceful failure: we proceed to the result either way
  // so a misconfigured endpoint never costs Rodrigo the lead in front of him.
  try {
    if (LEAD_ENDPOINT && LEAD_ENDPOINT.startsWith("http")) {
      await fetch(LEAD_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
    } else {
      console.warn("[DreamBuilder] LEAD_ENDPOINT not configured — lead not sent:", payload);
    }
  } catch (err) {
    // Swallow: the result + booking must still appear.
    console.warn("[DreamBuilder] Lead POST failed (showing result anyway):", err);
  }

  showResult();
}

/* =========================================================================
   RESULT + SCHEDULING RENDER
   ========================================================================= */
function showResult() {
  state.view = "result";
  el("quizSection").hidden = true;
  el("resultSection").hidden = false;
  renderResult();
  scrollQuizIntoView();
}

function renderResult() {
  const tier = state.tier;
  const badgeKey = tier === "A" ? "resultBadgeA" : tier === "B" ? "resultBadgeB" : "resultBadgeC";
  const msgKey = tier === "A" ? "resultA" : tier === "B" ? "resultB" : "resultC";

  el("resultCard").innerHTML = `
    <span class="result-badge badge-${tier}">${t(badgeKey)}</span>
    <p class="result-msg">${t(msgKey)}</p>
    <p class="lead-note">${t("leadSavedNote")}</p>

    <!-- ================================================================
         TODO: Google Calendar Appointment Schedule embed.
         The iframe below uses CALENDAR_EMBED_URL (set at top of script).
         For prefilled name/email + automation, swap this iframe for a
         Cal.com or Calendly embed.
         ================================================================ -->
    <h3 class="book-header">${t("bookHeader")}</h3>
    <iframe class="cal-frame" src="${CALENDAR_EMBED_URL}"
            title="${t("bookHeader")}" loading="lazy"></iframe>
    <p class="book-fallback">${t("bookFallback")}
      <a href="${CALENDAR_BOOKING_URL}" target="_blank" rel="noopener">${t("bookFallbackLink")}</a>
    </p>

    <div class="alt-actions">
      <a class="btn-secondary" href="mailto:${CONFIG.loEmail}">${t("emailMe")}</a>
      <a class="btn-secondary" href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">${t("dmMe")}</a>
      <button class="btn-secondary" id="startOverBtn" type="button">${t("startOver")}</button>
    </div>

    <p class="micro-disclaimer">${t("resultDisclaimer")}</p>
  `;

  el("startOverBtn").addEventListener("click", startOver);
}

function startOver() {
  state.step = 1;
  state.view = "quiz";
  state.answers = {};
  state.contact = {};
  state.tier = null;
  el("resultSection").hidden = true;
  el("quizSection").hidden = false;
  renderStep();
  el("heroSection").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* =========================================================================
   LANGUAGE TOGGLE — re-renders ALL visible copy live, preserving state.
   ========================================================================= */
function toggleLang() {
  state.lang = state.lang === "pt" ? "en" : "pt";
  renderChrome();
  if (state.view === "result") renderResult();
  else renderStep();
}

/* =========================================================================
   INIT
   ========================================================================= */
function init() {
  renderChrome();
  state.step = 1;
  state.view = "quiz";
  renderStep();

  el("langBtn").addEventListener("click", toggleLang);
  el("heroCta").addEventListener("click", () => {
    el("quizSection").scrollIntoView({ behavior: "smooth", block: "start" });
    const ft = el("quizCard").querySelector(".q-title");
    if (ft) ft.focus({ preventScroll: true });
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
