<script>
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

function init() {
  document.getElementById('backLink').href = CONFIG.wizardUrl;
  document.getElementById('effectiveDate').textContent = CONFIG.effectiveDate;
  document.getElementById('contactEmail').href = `mailto:${CONFIG.loEmail}`;
  document.getElementById('contactEmail').textContent = CONFIG.loEmail;
  document.getElementById('contactPhone').href = `tel:${CONFIG.loPhone.replace(/\D/g,'')}`;
  document.getElementById('contactPhone').textContent = CONFIG.loPhone;
  document.getElementById('contactMail').textContent = CONFIG.companyAddress;
  document.getElementById('year').textContent = new Date().getFullYear();

  document.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.addEventListener('click', () => { lang = btn.dataset.lang; applyLang(); });
  });

  applyLang();
}

document.addEventListener('DOMContentLoaded', init);
</script>
