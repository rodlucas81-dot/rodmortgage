<script>
// ============================================================================
// STATE
// ============================================================================
const STEPS = ["payment", "down", "property", "hoa", "costs", "you"];

const S = {
  lang: (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en",
  screen: "hero",          // "hero" | step name | "result"
  payment: 3000,
  downMode: "pct",         // "pct" | "amt"
  downPct: 5,
  downAmt: 30000,
  st: "FL",
  propType: "house",       // house | town | condo
  occ: "primary",          // primary | second | invest
  hoaHas: null,            // "yes" | "no" | null
  hoa: 0,
  taxKnown: "no",
  taxAnnual: 0,
  insKnown: "no",
  insAnnual: 0,
  vet: "no",               // no | yes | disab
  res: "citizen",          // citizen | pr | visa | itin | fn
  income: "w2",            // w2 | self | bank | dscr
  fico: "720-739",
  pick: null,              // program the user tapped on the result screen
};

const RATES = { ...CONFIG.fallbackRates, asOf: null, live: false };

function t(key, ...args) {
  let s = i18n[S.lang][key] ?? i18n.en[key] ?? key;
  args.forEach((a, i) => { s = s.replace("{" + i + "}", a); });
  return s;
}

// ============================================================================
// FORMAT
// ============================================================================
const locale = () => (S.lang === "pt" ? "pt-BR" : "en-US");
// Dollar amounts stay in USD with US separators in both languages — the
// numbers are American prices, and "US$ 450.000" reads oddly next to "$3,000".
function usd(n) {
  return "$" + Math.round(n).toLocaleString("en-US");
}
function pct(n, digits = 2) {
  return (n * 100).toFixed(digits).replace(/\.?0+$/, "") + "%";
}
function pctFixed(n, digits = 3) {
  return (n * 100).toFixed(digits) + "%";
}
function parseNum(s) {
  const n = parseFloat(String(s).replace(/[^0-9.]/g, ""));
  return Number.isFinite(n) ? n : 0;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ============================================================================
// PROGRAMS
// ============================================================================
function ficoLow(band) {
  if (band === "unknown") return 680;
  if (band === "<580") return 500;
  return parseInt(band, 10);
}
function convBand(band) {
  // map any answer onto the conventional pricing table's bands
  const f = ficoLow(band);
  if (f >= 760) return "760+";
  if (f >= 740) return "740-759";
  if (f >= 720) return "720-739";
  if (f >= 700) return "700-719";
  if (f >= 680) return "680-699";
  if (f >= 660) return "660-679";
  if (f >= 640) return "640-659";
  return "620-639";
}
function govBand(band) {
  const f = ficoLow(band);
  if (f >= 640) return "640+";
  if (f >= 620) return "620-639";
  if (f >= 580) return "580-619";
  return "<580";
}
function nonQmKind() {
  if (S.res === "fn") return "fn";
  if (S.res === "itin") return "itin";
  if (S.income === "dscr") return "dscr";
  if (S.income === "bank") return "bank";
  return "other";
}

// Which programs this profile can use at all. Down payment and loan size are
// checked later, as warnings, because they depend on the computed price.
function availablePrograms() {
  const fico = ficoLow(S.fico);
  const agencyRes = ["citizen", "pr", "visa"].includes(S.res);
  const govRes = ["citizen", "pr"].includes(S.res);
  const fullDoc = ["w2", "self"].includes(S.income);
  const list = [];

  const off = CONFIG.offered;
  if (off.va && S.vet !== "no" && S.occ === "primary" && govRes && fullDoc && fico >= 580) list.push("va");
  if (off.conv && agencyRes && fullDoc && fico >= 620) list.push("conv");
  if (off.fha && S.occ === "primary" && govRes && fullDoc && fico >= 500) list.push("fha");
  if (!list.length && off[nonQmKind()]) list.push("nonqm");
  return list;
}

function programName(id, r) {
  if (id === "conv") return r && r.jumbo ? t("pJumbo") : t("pConv");
  if (id === "fha") return t("pFha");
  if (id === "va") return t("pVa");
  return t({ bank: "pBank", dscr: "pDscr", itin: "pItin", fn: "pFn", other: "pNonqm" }[nonQmKind()]);
}

function ltvBucket(ltv) {
  if (ltv <= 0.80) return 80;
  if (ltv <= 0.85) return 85;
  if (ltv <= 0.90) return 90;
  if (ltv <= 0.95) return 95;
  return 97;
}

// Rate, mortgage insurance and upfront fee for a program at a given loan
// size and LTV. Called repeatedly by the solver as the price converges.
function pricing(id, baseLoan, ltv) {
  const occ = CONFIG.occupancyAdj[S.occ] || 0;
  if (id === "conv") {
    const jumbo = baseLoan > CONFIG.conformingLimit;
    const band = convBand(S.fico);
    const rate = (jumbo ? RATES.jumbo + Math.max(0, CONFIG.convFicoAdj[band]) : RATES.conv + CONFIG.convFicoAdj[band]) + occ;
    // Jumbo loans normally require 20% down and carry no MI; under 20% it's
    // the same BPMI table as a reasonable stand-in.
    const mi = CONFIG.miFactors[band][ltvBucket(ltv)];
    return { rate, mi, upfront: 0, jumbo };
  }
  if (id === "fha") {
    const rate = RATES.fha + CONFIG.govFicoAdj[govBand(S.fico)];
    const hi = baseLoan > CONFIG.fhaMipLoanBreak;
    const mi = ltv > 0.95 ? (hi ? 0.0075 : 0.0055) : (hi ? 0.0070 : 0.0050);
    return { rate, mi, upfront: CONFIG.fhaUfmip };
  }
  if (id === "va") {
    const rate = RATES.va + CONFIG.govFicoAdj[govBand(S.fico)];
    const down = 1 - ltv;
    const ff = CONFIG.vaFundingFee;
    const upfront = S.vet === "disab" ? 0 : down >= 0.10 ? ff.tenPlus : down >= 0.05 ? ff.under10 : ff.under5;
    return { rate, mi: 0, upfront };
  }
  // non-QM: spread over the conforming index, a bit more for weaker credit
  const k = CONFIG.nonQm[nonQmKind()];
  const rate = RATES.conv + k.spread + (ficoLow(S.fico) < 680 ? 0.005 : 0) + occ;
  return { rate, mi: 0, upfront: 0 };
}

function minDown(id, r) {
  if (id === "va") return 0;
  if (id === "fha") return ficoLow(S.fico) < 580 ? 0.10 : 0.035;
  if (id === "conv") {
    if (r && r.jumbo) return 0.10;
    return S.occ === "invest" ? 0.15 : S.occ === "second" ? 0.10 : 0.03;
  }
  return Math.max(CONFIG.nonQm[nonQmKind()].minDown, S.occ === "invest" ? 0.20 : 0);
}

// ============================================================================
// SOLVER
// ----------------------------------------------------------------------------
// The payment is linear in the price once the rate, MI factor and upfront fee
// are fixed:
//
//   payment = B·(1+u)·(f + m/12) + P·(tax% + ins%)/12 + fixed
//
// where B is the base loan (P·(1−d), or P − D for a dollar down payment), f the
// monthly P&I factor, m the annual MI rate, u the financed upfront fee, and
// "fixed" anything that doesn't scale with price (HOA, known taxes, condo
// HO-6). So P solves in closed form. The rate/MI/fee depend on LTV and loan
// size, so it re-prices and re-solves a few times until it settles.
// ============================================================================
function piFactor(rate) {
  const i = rate / 12, n = CONFIG.termMonths;
  return i / (1 - Math.pow(1 + i, -n));
}

function solve(id, payment) {
  const taxPct = S.taxKnown === "yes" ? 0 : CONFIG.taxRateByState[S.st];
  const condo = S.propType === "condo";
  const insPct = S.insKnown === "yes" || condo ? 0 : CONFIG.hoiRate;
  const hoa = S.hoaHas === "yes" ? S.hoa : 0;
  const taxFixed = S.taxKnown === "yes" ? S.taxAnnual / 12 : 0;
  const insFixed = S.insKnown === "yes" ? S.insAnnual / 12 : condo ? CONFIG.condoHo6Monthly : 0;
  const fixed = hoa + taxFixed + insFixed;
  const room = payment - fixed;
  if (room <= 0) return { noRoom: true };

  const c = (taxPct + insPct) / 12;
  let P = 300000, pr, k;
  for (let iter = 0; iter < 12; iter++) {
    const down = S.downMode === "pct" ? P * S.downPct / 100 : Math.min(S.downAmt, P);
    const B = Math.max(0, P - down);
    pr = pricing(id, B, P > 0 ? B / P : 0);
    k = (1 + pr.upfront) * (piFactor(pr.rate) + pr.mi / 12);
    const next = S.downMode === "pct"
      ? room / ((1 - S.downPct / 100) * k + c)
      : (room + S.downAmt * k) / (k + c);
    if (Math.abs(next - P) < 1) { P = next; break; }
    P = next;
  }

  // A dollar down payment bigger than the price it buys means no loan at all.
  const down = S.downMode === "pct" ? P * S.downPct / 100 : Math.min(S.downAmt, P);
  const base = Math.max(0, P - down);
  const loan = base * (1 + pr.upfront);
  const pi = loan * piFactor(pr.rate);
  const mi = loan * pr.mi / 12;   // FHA MIP is charged on the balance, which includes the financed UFMIP
  const tax = taxFixed + P * taxPct / 12;
  const ins = insFixed + P * insPct / 12;

  const r = {
    id, price: P, down, downFrac: P > 0 ? down / P : 0, base, loan, pi, mi, tax, ins, hoa,
    total: pi + mi + tax + ins + hoa,
    rate: pr.rate, miRate: pr.mi, upfront: pr.upfront, jumbo: !!pr.jumbo,
  };
  r.stream = paymentStream(r);
  r.apr = computeApr(r);
  return r;
}

// ============================================================================
// APR + REPAYMENT TERMS  (Reg Z §1026.22 / Appendix J, §1026.24(d))
// ----------------------------------------------------------------------------
// Builds the actual payment stream — P&I plus mortgage insurance for exactly
// as long as it lasts — then finds the rate at which those payments discount
// back to the amount financed.
//
// Mortgage insurance duration:
//   Conventional BPMI  ends automatically when the scheduled balance reaches
//                      78% of the original value (Homeowners Protection Act).
//   FHA annual MIP     11 years if the base LTV is 90% or less, otherwise for
//                      the life of the loan; re-figured each year on the
//                      balance, so it steps down annually.
//   VA / non-QM        none.
// ============================================================================
function paymentStream(r) {
  const n = CONFIG.termMonths, i = r.rate / 12;
  const fhaMonths = r.id === "fha" ? (r.base / r.price > 0.90 ? n : 132) : 0;
  let bal = r.loan, yearMi = r.mi;
  const out = [];
  for (let k = 0; k < n; k++) {
    let mi = 0;
    if (r.id === "fha" && k < fhaMonths) {
      if (k % 12 === 0) yearMi = bal * r.miRate / 12;
      mi = yearMi;
    } else if (r.id === "conv" && r.mi > 0 && bal > 0.78 * r.price) {
      mi = r.mi;
    }
    out.push(r.pi + mi);
    bal -= r.pi - bal * i;
  }
  return out;
}

function lenderFeeTotal() {
  return Object.values(CONFIG.lenderFees).reduce((a, b) => a + b, 0);
}
function prepaidInterest(r) {
  return r.loan * r.rate / 365 * CONFIG.prepaidInterestDays;
}

function computeApr(r) {
  if (r.loan <= 0) return r.rate;
  // Financed UFMIP / funding fee are finance charges, so they come out of the
  // amount financed along with the prepaid charges and any points.
  const amountFinanced = r.base - lenderFeeTotal() - prepaidInterest(r) - r.loan * CONFIG.discountPoints / 100;
  const pv = i => r.stream.reduce((s, p, k) => s + p / Math.pow(1 + i, k + 1), 0);
  let lo = 0, hi = 0.05;
  for (let it = 0; it < 60; it++) {
    const mid = (lo + hi) / 2;
    if (pv(mid) > amountFinanced) lo = mid; else hi = mid;
  }
  return ((lo + hi) / 2) * 12;
}

// Plain-language repayment terms: the payment amounts and how many of each.
function repaymentText(r) {
  const n = CONFIG.termMonths;
  const s = r.stream;
  if (r.id === "fha" && r.mi > 0) {
    const life = r.base / r.price > 0.90;
    return t(life ? "repayFhaLife" : "repayFha11", n, usd(s[0]), usd(r.pi));
  }
  const firstOff = s.findIndex(p => Math.abs(p - s[0]) > 0.5);
  if (firstOff < 0) return t("repayLevel", n, usd(s[0]));
  return t("repayMiOff", firstOff, usd(s[0]), n - firstOff, usd(s[firstOff]));
}

function warningsFor(r) {
  const w = [];
  const need = minDown(r.id, r);
  const lowFicoFha = r.id === "fha" && ficoLow(S.fico) < 580;
  if (r.downFrac + 0.0005 < need) w.push(lowFicoFha ? t("wFhaLowFico") : t("wDown", pct(need, 1)));
  if (r.id === "conv" && r.jumbo) w.push(t("wJumbo", usd(CONFIG.conformingLimit)));
  if (r.id === "fha") {
    if (r.base > CONFIG.highCostCeiling) w.push(t("wFhaCeiling", usd(CONFIG.highCostCeiling)));
    else if (r.base > CONFIG.fhaFloor) w.push(t("wFhaLimit", usd(CONFIG.fhaFloor), usd(CONFIG.highCostCeiling)));
    if (S.propType === "condo") w.push(t("wFhaCondo"));
  }
  return w;
}

// Recommend: VA when eligible; otherwise whichever reachable program buys more
// house. A program whose minimum down payment isn't met only wins if nothing
// else is reachable.
function recommend(results) {
  const ok = results.filter(r => r.downFrac + 0.0005 >= minDown(r.id, r) && !(r.id === "fha" && r.base > CONFIG.highCostCeiling));
  const pool = ok.length ? ok : results;
  const va = pool.find(r => r.id === "va");
  if (va) return va;
  return pool.reduce((a, b) => (b.price > a.price ? b : a));
}

function whyText(r) {
  if (r.id === "va") return t("whyVa") + (S.vet === "disab" ? " " + t("whyVaDisab") : "");
  if (r.id === "conv") return availablePrograms().includes("fha") ? t("whyConv") : "";
  if (r.id === "fha") return availablePrograms().includes("conv") ? t("whyFha") : "";
  if (["itin", "fn"].includes(S.res)) return t("whyNonqmRes");
  if (["bank", "dscr"].includes(S.income)) return t("whyNonqmInc");
  return t("whyNonqmFico");
}

// Only the numbers re-render while the slider moves, so it keeps focus.
function updateResult() {
  const programs = availablePrograms();
  const results = programs.map(id => solve(id, S.payment));
  const top = document.getElementById("res-top");

  if (!results.length || results[0].noRoom) {
    top.innerHTML = `<div class="warn">${results.length ? t("wNoRoom") : t("noProgram")}</div>`;
    document.getElementById("cta-wa").href = "https://wa.me/" + CONFIG.whatsappNumber;
    ["res-tabs-card", "res-breakdown", "res-facts"].forEach(id => (document.getElementById(id).hidden = true));
    return;
  }
  ["res-tabs-card", "res-breakdown", "res-facts"].forEach(id => (document.getElementById(id).hidden = false));

  const best = recommend(results);
  const r = results.find(x => x.id === S.pick) || best;
  const name = programName(r.id, r);

  top.innerHTML = `
    <p class="result-lead">${t("resultLead", usd(S.payment))}</p>
    <div class="result-price">${usd(r.price)}</div>
    <p class="price-note">${t("priceNote")}</p>
    <span class="prog-chip">${r === best ? t("programLabel", name) : name}</span>
    ${r === best && whyText(r) ? `<p class="why">${whyText(r)}</p>` : ""}`;

  document.getElementById("res-tabs-card").hidden = results.length < 2;
  document.getElementById("res-tabs").innerHTML = results.map(x => `
    <button type="button" class="tab${x.id === r.id ? " selected" : ""}" data-pick="${x.id}">
      <div class="tn">${programName(x.id, x)}</div><div class="tp">${usd(x.price)}</div>
    </button>`).join("");

  const parts = [
    ["#f0c85a", t("rowPi"), r.pi, false],
    ["#a78bfa", r.id === "fha" ? t("rowMiFha") : t("rowMi"), r.mi, false],
    ["#60a5fa", t("rowTax"), r.tax, S.taxKnown !== "yes"],
    ["#4ade80", t("rowIns"), r.ins, S.insKnown !== "yes"],
    ["#f472b6", t("rowHoa"), r.hoa, false],
  ].filter(p => p[2] > 0.5);
  document.getElementById("res-breakdown").innerHTML = `
    <h3>${t("breakdown", usd(S.payment))}</h3>
    <div class="bar">${parts.map(p => `<span style="width:${(p[2] / r.total) * 100}%;background:${p[0]}"></span>`).join("")}</div>
    <table class="rows">
      ${parts.map(p => `<tr><td><span class="dot" style="background:${p[0]}"></span>${p[1]}${p[3] ? `<span class="est">${t("estTag")}</span>` : ""}</td><td>${usd(p[2])}</td></tr>`).join("")}
      <tr class="total"><td>${t("rowTotal")}</td><td>${usd(r.total)}</td></tr>
    </table>`;

  const loanLabel = r.id === "fha" ? t("factLoanFha", pct(r.upfront))
    : r.id === "va" && r.upfront > 0 ? t("factLoanVa", pct(r.upfront))
    : t("factLoan");
  const warns = warningsFor(r);
  if (r.id === "conv" && r.jumbo && !CONFIG.offered.jumbo) warns.push(t("wJumboNotOffered"));
  if (S.fico === "unknown") warns.push(t("wFicoUnknown"));
  const income = r.id !== "nonqm" || nonQmKind() !== "dscr"
    ? t("incomeNeeded", usd(S.payment / CONFIG.dtiForIncome))
    : t("rentNeeded", usd(S.payment));

  // Everything §1026.24(d) asks for once a payment or down payment is shown —
  // down payment, repayment terms, APR — sits right here next to the numbers,
  // not in the footer.
  const source = RATES.live ? t("srcLive", fmtDate(RATES.asOf)) : t("srcFallback", fmtDate(CONFIG.fallbackAsOf));
  const ficoTxt = S.fico === "unknown" ? t("ficoAssumed") : S.fico.replace("-", "–");
  const occTxt = t({ primary: "occPrimary", second: "occSecond", invest: "occInvest" }[S.occ]);
  const assumptions = t("assumptions", name, usd(r.price), usd(r.down) + " (" + pct(r.downFrac, 1) + ")", usd(r.loan),
    ficoTxt, occTxt.toLowerCase(), source, CONFIG.discountPoints, usd(CONFIG.lenderFees.application), usd(CONFIG.lenderFees.processing), CONFIG.prepaidInterestDays)
    + (r.id === "va" && r.upfront > 0 ? " " + t("assumpVa") : "");

  document.getElementById("res-facts").innerHTML = `
    <h3>${t("facts")}</h3>
    <table class="rows">
      <tr><td>${t("factDown")}</td><td>${usd(r.down)} (${pct(r.downFrac, 1)})</td></tr>
      <tr><td>${loanLabel}</td><td>${usd(r.loan)}</td></tr>
      <tr><td>${t("factInterest")}</td><td>${pctFixed(r.rate)}</td></tr>
      <tr><td>${t("factApr")}</td><td>${pctFixed(r.apr)}</td></tr>
      <tr><td>${t("factTerm")}</td><td>${t("years30")}</td></tr>
    </table>
    <p class="info">${repaymentText(r)} ${t("repayPlus")}</p>
    ${warns.map(w => `<div class="warn">${w}</div>`).join("")}
    <p class="info">${income}</p>
    <p class="fine">${assumptions}</p>`;

  const stName = { FL: "Florida", MA: "Massachusetts", CT: "Connecticut" }[S.st];
  const typeName = t({ house: "typeHouse", town: "typeTown", condo: "typeCondo" }[S.propType]);
  const downTxt = S.downMode === "pct" ? pct(S.downPct / 100, 1) : usd(S.downAmt);
  const msg = t("waMsg", usd(S.payment), downTxt, stName, typeName, usd(r.price), name);
  document.getElementById("cta-wa").href = "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(msg);
}

function fmtDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(locale(), { month: "short", day: "numeric", year: "numeric" });
}

// ============================================================================
// EVENTS
// ============================================================================
function go(screen) {
  if (screen === "result") S.pick = null;
  S.screen = screen;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function canAdvance() {
  if (S.screen === "payment") return S.payment >= 300;
  if (S.screen === "down") return S.downMode === "pct" ? S.downPct >= 0 && S.downPct < 100 : S.downAmt >= 0;
  if (S.screen === "hoa") return S.propType === "condo" || S.hoaHas !== null;
  return true;
}
function refreshNext() {
  const b = document.getElementById("next-btn");
  if (b) b.disabled = !canAdvance();
}

function wire() {
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

  document.querySelectorAll("[data-set]").forEach(b => b.addEventListener("click", () => {
    const key = b.dataset.set, v = b.dataset.val;
    if (key === "downPct") {
      if (v === "other") {
        const o = document.getElementById("down-other");
        o.hidden = false;
        b.parentElement.querySelectorAll(".pill").forEach(p => p.classList.toggle("selected", p === b));
        document.getElementById("in-downpct").focus();
        return;
      }
      S.downPct = parseFloat(v);
    } else {
      S[key] = v;
    }
    // A condo always has an HOA question and a flat HO-6; switching away
    // keeps whatever HOA they typed but asks again.
    if (key === "propType") S.hoaHas = v === "condo" ? "yes" : null;
    if (key === "occ" && v !== "invest" && S.income === "dscr") S.income = "w2";
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }));

  bindMoney("in-payment", v => {
    S.payment = v;
    const r = document.getElementById("rng-payment");
    if (r) r.value = v;
  });
  const rng = document.getElementById("rng-payment");
  if (rng) rng.addEventListener("input", () => {
    S.payment = parseInt(rng.value, 10);
    document.getElementById("in-payment").value = S.payment.toLocaleString("en-US");
    if (S.screen === "result") updateResult();
    refreshNext();
  });
  bindMoney("in-downamt", v => (S.downAmt = v));
  bindMoney("in-hoa", v => (S.hoa = v));
  bindMoney("in-tax", v => (S.taxAnnual = v));
  bindMoney("in-ins", v => (S.insAnnual = v));
  const dp = document.getElementById("in-downpct");
  if (dp) dp.addEventListener("input", () => { S.downPct = Math.min(99, parseNum(dp.value)); refreshNext(); });

  refreshNext();
}

function bindMoney(id, set) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("input", () => {
    set(parseNum(el.value));
    if (S.screen === "result") updateResult();
    refreshNext();
  });
  el.addEventListener("blur", () => {
    const n = parseNum(el.value);
    el.value = n ? Math.round(n).toLocaleString("en-US") : "";
  });
}

// Program tabs are re-rendered by updateResult(), so their clicks are
// delegated from the container instead of bound once.
document.addEventListener("click", e => {
  const tab = e.target.closest("#res-tabs [data-pick]");
  if (!tab) return;
  S.pick = tab.dataset.pick;
  updateResult();
});

function applyLang() {
  document.documentElement.lang = S.lang === "pt" ? "pt-BR" : "en";
  document.getElementById("brand-img").src = CONFIG.loHeadshot;
  document.getElementById("brand-name").textContent = CONFIG.loName;
  document.getElementById("brand-title").textContent = CONFIG.loTitle + " | " + CONFIG.nmls;
  document.getElementById("lang-btn").textContent = t("langSwitch");
  document.getElementById("site-footer").innerHTML = renderFooter();
  render();
}

async function loadRates() {
  try {
    const res = await fetch(CONFIG.ratesEndpoint);
    if (!res.ok) return;
    const j = await res.json();
    if (![j.conv, j.fha, j.va, j.jumbo].every(v => typeof v === "number" && v > 0.01 && v < 0.2)) return;
    Object.assign(RATES, { conv: j.conv, fha: j.fha, va: j.va, jumbo: j.jumbo, asOf: j.asOf, live: true });
    if (S.screen === "result") updateResult();
  } catch (_) {
    // stays on CONFIG.fallbackRates; the result screen says so
  }
}

(function init() {
  // ?lang=pt / ?lang=en lets a shared link force the language
  const qp = new URLSearchParams(location.search).get("lang");
  if (qp === "pt" || qp === "en") S.lang = qp;
  document.getElementById("lang-btn").onclick = () => {
    S.lang = S.lang === "en" ? "pt" : "en";
    applyLang();
  };
  applyLang();
  loadRates();
})();
</script>
