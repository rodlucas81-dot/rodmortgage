<style>
:root {
  --gold: #d4a843;
  --gold2: #f0c85a;
  --dark: #0b0f18;
  --dark2: #101520;
  --dark3: #181f2e;
  --dark4: #1f2738;
  --cream: #e8edf8;
  --muted: #7a8bae;
  --border: rgba(255,255,255,0.08);
  --green: #4ade80;
  --green2: rgba(74,222,128,0.10);
  --red: #ff6b6b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--dark);
  color: var(--cream);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: 'Lora', Georgia, serif; font-weight: 700; line-height: 1.2; }
a { color: var(--gold2); text-decoration: none; }
a:hover { color: var(--gold); }

.topbar {
  background: var(--dark2);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; background: var(--dark3); }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text strong { color: var(--cream); font-size: 13px; font-weight: 700; }
.brand-text span { color: var(--muted); font-size: 11px; }
.lang-btn {
  background: transparent; color: var(--cream); border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.lang-btn:hover { border-color: var(--gold); color: var(--gold2); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

.hero {
  text-align: center;
  padding: 0 0 22px;
}
.badge {
  display: inline-block; background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: var(--dark); font-weight: 800; font-size: 11px; letter-spacing: 0.08em;
  padding: 6px 12px; border-radius: 999px; margin-bottom: 14px;
}
.hero h1 { font-size: clamp(26px, 5vw, 36px); margin-bottom: 10px; }
.hero p { color: var(--muted); font-size: 15px; max-width: 720px; margin: 0 auto; }

.disclosure-pill {
  display: block; max-width: 720px; margin: 14px auto 0;
  background: var(--dark2); border: 1px solid var(--border);
  border-left: 3px solid var(--gold); border-radius: 8px;
  padding: 9px 14px; font-size: 11px; color: var(--muted); line-height: 1.5; text-align: left;
}

/* CALCULATOR GRID */
.calc-grid {
  display: grid;
  grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr);
  gap: 16px;
  margin-top: 18px;
}
@media (max-width: 820px) {
  .calc-grid { grid-template-columns: 1fr; }
}

.card {
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 18px 20px;
}
.card h3 {
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  color: var(--gold);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field > label {
  display: block; color: var(--cream); font-size: 12px; font-weight: 600;
  margin-bottom: 6px;
}
.field input[type="text"],
.field input[type="number"],
.field input[type="date"] {
  width: 100%; background: var(--dark3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; color: var(--cream); font-size: 15px;
  font-family: inherit; outline: none;
}
.field input:focus { border-color: var(--gold); }

.input-wrap-prefix {
  position: relative;
}
.input-wrap-prefix .prefix {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 14px; pointer-events: none;
}
.input-wrap-prefix input { padding-left: 26px; }
.input-wrap-suffix .suffix {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 13px; pointer-events: none;
}
.input-wrap-suffix input { padding-right: 32px; }

.term-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.term-pill {
  background: var(--dark3); border: 1px solid var(--border); border-radius: 999px;
  padding: 7px 12px; color: var(--cream); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.term-pill:hover { border-color: var(--gold); }
.term-pill.selected { border-color: var(--gold); background: rgba(212,168,67,0.12); color: var(--gold2); }

.checkbox-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; cursor: pointer; }
.checkbox-row input { margin-top: 3px; flex: 0 0 auto; }
.checkbox-row span { font-size: 13px; color: var(--cream); line-height: 1.45; }
.help-text { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }

/* COMPARE TABLE */
.compare {
  position: sticky; top: 76px;
}
.compare-table {
  width: 100%; border-collapse: collapse; margin-top: 4px;
}
.compare-table th, .compare-table td {
  padding: 10px 6px; font-size: 13px; border-bottom: 1px solid var(--border);
}
.compare-table th {
  font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-size: 10px;
}
.compare-table th.col-std { color: var(--muted); text-align: right; }
.compare-table th.col-acc { color: var(--gold2); text-align: right; }
.compare-table td.label { color: var(--cream); }
.compare-table td.std { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.compare-table td.acc {
  color: var(--cream); text-align: right; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.compare-table tr.savings td { background: var(--green2); }
.compare-table tr.savings td.label { color: var(--cream); font-weight: 700; }
.compare-table tr.savings td.acc { color: var(--green); font-weight: 800; font-size: 14px; }
.compare-table tr:last-child td { border-bottom: 0; }
.diff-pill {
  display: inline-block; font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 500;
}

/* SCHEDULE */
.schedule-card {
  margin-top: 16px;
}
.schedule-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
}
.view-toggle { display: flex; gap: 4px; background: var(--dark3); border-radius: 999px; padding: 3px; }
.view-toggle button {
  background: transparent; color: var(--muted); border: 0;
  padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.view-toggle button.active { background: var(--gold); color: var(--dark); }

.schedule-wrap {
  overflow-x: auto;
  max-height: 480px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
}
.schedule-table {
  width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums;
}
.schedule-table thead {
  position: sticky; top: 0; background: var(--dark3); z-index: 1;
}
.schedule-table th, .schedule-table td {
  padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); color: var(--cream);
  white-space: nowrap;
}
.schedule-table th:first-child, .schedule-table td:first-child { text-align: left; color: var(--muted); }
.schedule-table th {
  font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
  background: var(--dark3);
}
.schedule-table tbody tr:hover { background: rgba(255,255,255,0.02); }
.schedule-table .balance { font-weight: 700; color: var(--gold2); }
.schedule-empty {
  padding: 36px 24px; text-align: center; color: var(--muted); font-size: 13px; font-style: italic;
}

/* CTA */
.cta-block {
  margin-top: 28px;
  background: linear-gradient(135deg, var(--dark2), var(--dark3));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 26px 24px;
  text-align: center;
}
.cta-block h2 { font-size: 22px; color: var(--cream); margin-bottom: 10px; }
.cta-block p { color: var(--muted); font-size: 14px; max-width: 600px; margin: 0 auto 18px; line-height: 1.55; }
.cta-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn-primary {
  display: inline-block; background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: var(--dark); font-weight: 800; font-size: 14px;
  padding: 13px 22px; border-radius: 12px; border: 0;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 20px rgba(212,168,67,0.22);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-secondary {
  display: inline-block; background: transparent; color: var(--cream);
  border: 1px solid var(--border); padding: 13px 18px; border-radius: 12px;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.btn-secondary:hover { border-color: var(--gold); color: var(--gold2); }

/* FOOTER */
footer {
  margin-top: 36px; padding: 28px 20px 40px;
  border-top: 1px solid var(--border);
  background: var(--dark2);
  color: var(--muted); font-size: 12px; line-height: 1.6;
}
.foot-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.foot-identity { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.foot-block { background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; }
.foot-block .label { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.foot-block .name { color: var(--cream); font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.foot-block .meta { font-size: 11px; color: var(--muted); }
.foot-block .meta a { color: var(--gold2); }
.foot-licenses { background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; font-size: 11px; }
.foot-licenses .label { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.foot-eho { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; }
.foot-eho .eho-svg { width: 36px; height: 36px; flex: 0 0 36px; }
.foot-eho strong { color: var(--cream); font-size: 12px; }
.foot-legal { font-size: 11px; line-height: 1.65; color: var(--muted); padding: 0 4px; }
.foot-links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; padding: 0 4px; }
.foot-links a { color: var(--gold2); font-weight: 600; }
.foot-copyright { font-size: 11px; color: var(--muted); text-align: center; padding-top: 8px; border-top: 1px solid var(--border); }
@media (max-width: 540px) { .foot-identity { grid-template-columns: 1fr; } }
</style>
</head>

      <div class="card">
        <h3><span>⚙️</span><span id="setupTitle"></span></h3>

            <span class="prefix">$</span>

            <button class="term-pill" type="button" data-years="25"><span data-i18n="term25"></span></button>
            <button class="term-pill selected" type="button" data-years="30"><span data-i18n="term30"></span></button>

<script>
// ============================================================================
// STATE
// ============================================================================
const state = {
  lang: (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en",
  view: "year",
};

function t(key) { return i18n[state.lang][key] || i18n.en[key] || key; }

// ============================================================================
// MATH
// ============================================================================
// Standard mortgage payment formula. annualRatePct = 6.5 for 6.5%
function pmt(annualRatePct, termMonths, principal) {
  if (principal <= 0 || termMonths <= 0) return 0;
  const i = annualRatePct / 100 / 12;
  if (i === 0) return principal / termMonths;
  return (principal * i) / (1 - Math.pow(1 + i, -termMonths));
}

function buildAmortSchedule({ loan, annualRatePct, termMonths, extraMonthly = 0, biweeklyExtra = 0, startDate }) {
  const schedule = [];
  if (loan <= 0 || annualRatePct < 0 || termMonths <= 0) {
    return { schedule, totals: { monthlyPI: 0, totalInterest: 0, payoffMonths: 0, payoffDate: null } };
  }
  const i = annualRatePct / 100 / 12;
  const monthlyPI = pmt(annualRatePct, termMonths, loan);
  const totalExtra = (extraMonthly || 0) + (biweeklyExtra || 0);
  let balance = loan;
  let totalInterest = 0;
  const start = startDate ? new Date(startDate + "T00:00:00") : new Date();
  // First payment is typically the 1st of the month after closing
  const firstPaymentDate = new Date(start.getFullYear(), start.getMonth() + 1, 1);
  const maxIterations = Math.max(termMonths + 24, 720);
  for (let m = 1; m <= maxIterations && balance > 0.005; m++) {
    const interest = balance * i;
    let principal = monthlyPI - interest;
    let extra = totalExtra;
    if (principal + extra > balance) {
      extra = Math.max(0, balance - principal);
      if (principal > balance) principal = balance;
    }
    const totalPmt = principal + interest + extra;
    balance = Math.max(0, balance - principal - extra);
    totalInterest += interest;
    const date = new Date(firstPaymentDate.getFullYear(), firstPaymentDate.getMonth() + m - 1, 1);
    schedule.push({ month: m, date, payment: totalPmt, interest, principal, extra, balance });
    if (balance <= 0.005) break;
  }
  const payoffDate = schedule.length ? schedule[schedule.length - 1].date : firstPaymentDate;
  return { schedule, totals: { monthlyPI, totalInterest, payoffMonths: schedule.length, payoffDate } };
}

// ============================================================================
// HELPERS
// ============================================================================
function parseNum(v) {
  if (v === null || v === undefined) return 0;
  const cleaned = String(v).replace(/[^\d.\-]/g, "");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function fmtUSD(n) {
  if (!isFinite(n)) return "—";
  return new Intl.NumberFormat(state.lang === "pt" ? "pt-BR" : "en-US", {
    style: "currency", currency: "USD", maximumFractionDigits: 0,
  }).format(n);
}
function fmtUSDDec(n) {
  if (!isFinite(n)) return "—";
  return new Intl.NumberFormat(state.lang === "pt" ? "pt-BR" : "en-US", {
    style: "currency", currency: "USD", maximumFractionDigits: 2,
  }).format(n);
}
function fmtDate(d) {
  if (!d) return "—";
  return d.toLocaleDateString(state.lang === "pt" ? "pt-BR" : "en-US", { month: "short", year: "numeric" });
}
function fmtTermDuration(months) {
  if (!months) return "—";
  const y = Math.floor(months / 12);
  const m = months % 12;
  if (state.lang === "pt") {
    if (y > 0 && m > 0) return `${y} ${y === 1 ? "ano" : "anos"} ${m} ${m === 1 ? "mês" : "meses"}`;
    if (y > 0) return `${y} ${y === 1 ? "ano" : "anos"}`;
    return `${m} ${m === 1 ? "mês" : "meses"}`;
  }
  if (y > 0 && m > 0) return `${y}y ${m}m`;
  if (y > 0) return `${y}y`;
  return `${m}m`;
}

function formatLoanInput(raw) {
  // Format with thousands separators, but only if it looks like a whole number
  const n = parseNum(raw);
  if (!n) return raw;
  return n.toLocaleString("en-US");
}

// ============================================================================
// COMPUTE + RENDER
// ============================================================================
function calc() {
  const loan = parseNum(document.getElementById("loanInput").value);
  const rate = parseNum(document.getElementById("rateInput").value);
  const term = parseNum(document.getElementById("termInput").value) || 360;
  const extra = parseNum(document.getElementById("extraInput").value);
  const biweekly = document.getElementById("biweeklyInput").checked;
  const startDate = document.getElementById("startDateInput").value;

  const setEmpty = () => {
    [
      "cellMonthlyStd","cellMonthlyAcc","cellEffStd","cellEffAcc",
      "cellPayoffStd","cellPayoffAcc","cellTermStd","cellTermAcc",
      "cellIntStd","cellIntAcc","cellIntSaved","cellTimeSaved",
    ].forEach(id => { document.getElementById(id).textContent = "—"; });
    document.getElementById("scheduleContainer").innerHTML =
      `<div class="schedule-empty">${t("emptyState")}</div>`;
  };

  if (!loan || !rate) { setEmpty(); return; }

  const monthlyPI = pmt(rate, term, loan);
  const biweeklyExtra = biweekly ? monthlyPI / 12 : 0;

  const std = buildAmortSchedule({ loan, annualRatePct: rate, termMonths: term, extraMonthly: 0, biweeklyExtra: 0, startDate });
  const acc = buildAmortSchedule({ loan, annualRatePct: rate, termMonths: term, extraMonthly: extra, biweeklyExtra, startDate });

  const effAcc = monthlyPI + extra + biweeklyExtra;

  document.getElementById("cellMonthlyStd").textContent = fmtUSDDec(monthlyPI);
  document.getElementById("cellMonthlyAcc").textContent = fmtUSDDec(monthlyPI);
  document.getElementById("cellEffStd").textContent = fmtUSDDec(monthlyPI);
  const diff = effAcc - monthlyPI;
  document.getElementById("cellEffAcc").innerHTML =
    `${fmtUSDDec(effAcc)}${diff > 0 ? ` <span class="diff-pill">+${fmtUSDDec(diff)}</span>` : ""}`;
  document.getElementById("cellPayoffStd").textContent = fmtDate(std.totals.payoffDate);
  document.getElementById("cellPayoffAcc").textContent = fmtDate(acc.totals.payoffDate);
  document.getElementById("cellTermStd").textContent = fmtTermDuration(std.totals.payoffMonths);
  document.getElementById("cellTermAcc").textContent = fmtTermDuration(acc.totals.payoffMonths);
  document.getElementById("cellIntStd").textContent = fmtUSDDec(std.totals.totalInterest);
  document.getElementById("cellIntAcc").textContent = fmtUSDDec(acc.totals.totalInterest);

  const intSaved = std.totals.totalInterest - acc.totals.totalInterest;
  const monthsSaved = std.totals.payoffMonths - acc.totals.payoffMonths;
  document.getElementById("cellIntSaved").textContent = intSaved > 0.5 ? "+" + fmtUSDDec(intSaved) : "—";
  document.getElementById("cellTimeSaved").textContent =
    monthsSaved > 0 ? `${fmtTermDuration(monthsSaved)} ${t("yearsEarlier")}` : "—";

  renderSchedule(acc.schedule);
}

function renderSchedule(schedule) {
  const cont = document.getElementById("scheduleContainer");
  if (!schedule.length) {
    cont.innerHTML = `<div class="schedule-empty">${t("emptyState")}</div>`;
    return;
  }
  if (state.view === "year") {
    const yearMap = {};
    for (const row of schedule) {
      const y = row.date.getFullYear();
      if (!yearMap[y]) yearMap[y] = { year: y, payments: 0, interest: 0, principal: 0, extra: 0, endBalance: 0 };
      yearMap[y].payments += row.payment;
      yearMap[y].interest += row.interest;
      yearMap[y].principal += row.principal;
      yearMap[y].extra += row.extra;
      yearMap[y].endBalance = row.balance;
    }
    const years = Object.values(yearMap).sort((a, b) => a.year - b.year);
    cont.innerHTML = `
      <table class="schedule-table">
        <thead>
          <tr>
            <th>${t("colYear")}</th>
            <th>${t("colPayment")}</th>
            <th>${t("colInterest")}</th>
            <th>${t("colPrincipal")}</th>
            <th>${t("colExtra")}</th>
            <th>${t("colBalance")}</th>
          </tr>
        </thead>
        <tbody>
          ${years.map(y => `
            <tr>
              <td>${y.year}</td>
              <td>${fmtUSDDec(y.payments)}</td>
              <td>${fmtUSDDec(y.interest)}</td>
              <td>${fmtUSDDec(y.principal)}</td>
              <td>${y.extra > 0 ? fmtUSDDec(y.extra) : "—"}</td>
              <td class="balance">${fmtUSDDec(y.endBalance)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } else {
    cont.innerHTML = `
      <table class="schedule-table">
        <thead>
          <tr>
            <th>${t("colMonth")}</th>
            <th>${t("colDate")}</th>
            <th>${t("colPayment")}</th>
            <th>${t("colInterest")}</th>
            <th>${t("colPrincipal")}</th>
            <th>${t("colExtra")}</th>
            <th>${t("colBalance")}</th>
          </tr>
        </thead>
        <tbody>
          ${schedule.map(r => `
            <tr>
              <td>${r.month}</td>
              <td>${fmtDate(r.date)}</td>
              <td>${fmtUSDDec(r.payment)}</td>
              <td>${fmtUSDDec(r.interest)}</td>
              <td>${fmtUSDDec(r.principal)}</td>
              <td>${r.extra > 0 ? fmtUSDDec(r.extra) : "—"}</td>
              <td class="balance">${fmtUSDDec(r.balance)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }
}

// ============================================================================
// EHO logo + footer
// ============================================================================
function ehoLogoSvg() {

    <rect width="120" height="120" fill="#000"/>
    <polygon points="60,20 18,52 102,52 60,20" fill="#fff"/>

    <rect x="42" y="64" width="36" height="6" fill="#000"/>
    <rect x="42" y="78" width="36" height="6" fill="#000"/>
    <rect x="0" y="96" width="120" height="24" fill="#000"/>
    <text x="60" y="106" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">EQUAL HOUSING</text>
    <text x="60" y="116" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">LENDER</text>

function renderFooter() {
  return `
    <div class="foot-wrap">

          <div class="meta">${CONFIG.loTitle} · ${CONFIG.nmls}</div>
          <div class="meta"><a href="mailto:${CONFIG.loEmail}">${CONFIG.loEmail}</a> · <a href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">@rodmortgage</a></div>
        </div>
        <div class="foot-block">
          <div class="label">${t("footerCompany")}</div>
          <div class="name">${CONFIG.company}</div>

        <a href="${CONFIG.nmlsConsumerAccessUrl}" target="_blank" rel="noopener">${t("footerNmlsLink")} (NMLS 2471779)</a>
        <a href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">Instagram @rodmortgage</a>

// ============================================================================
// I18N APPLY
// ============================================================================
function applyLang() {
  document.documentElement.lang = state.lang;
  document.getElementById("brand-img").src = CONFIG.loHeadshot;
  document.getElementById("brand-name").textContent = CONFIG.loName;
  document.getElementById("brand-title").textContent = CONFIG.loTitle + " · " + CONFIG.nmls;
  document.getElementById("lang-btn").textContent = t("langSwitch");

  // Simple textContent fills
  const simpleIds = [
    "badge","pageTitle","pageSub","notAppNote",
    "setupTitle","loanLabel","rateLabel","termLabel","termMonthsLabel","startDateLabel",
    "accelTitle","extraLabel","biweeklyLabel","accelHelp",
    "compareTitle",
    "rowMonthly","rowEffective","rowPayoff","rowTerm","rowInterest","rowIntSaved","rowTimeSaved",
    "scheduleTitle",
    "ctaTitle","ctaSub",
  ];
  simpleIds.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = t(id);
  });

  // headers
  document.getElementById("thStd").textContent = t("colStandard");
  document.getElementById("thAcc").textContent = t("colAccel");
  document.getElementById("viewYearBtn").textContent = t("viewYear");
  document.getElementById("viewMonthBtn").textContent = t("viewMonth");

  // CTA
  document.getElementById("ctaBtn").textContent = t("ctaBtn");
  document.getElementById("ctaBtn").href = CONFIG.affordabilityUrl;
  document.getElementById("ctaBookBtn").textContent = t("ctaBookBtn");
  document.getElementById("ctaBookBtn").href = CONFIG.calendarShareUrl;

  // term pills inner labels
  document.querySelectorAll(".term-pill [data-i18n]").forEach(el => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });

  // Empty state if currently shown
  const empty = document.getElementById("emptyState");
  if (empty) empty.textContent = t("emptyState");

  // Footer
  document.getElementById("site-footer").innerHTML = renderFooter();

  // Recompute (date/currency formatting depends on language)
  calc();
}

// ============================================================================
// HANDLERS
// ============================================================================
function wireHandlers() {
  // Lang toggle
  document.getElementById("lang-btn").onclick = () => {
    state.lang = state.lang === "en" ? "pt" : "en";
    applyLang();
  };

  // Loan input with formatting on blur, raw entry while typing
  const loanEl = document.getElementById("loanInput");
  loanEl.addEventListener("input", () => calc());
  loanEl.addEventListener("blur", () => {
    const n = parseNum(loanEl.value);
    if (n) loanEl.value = formatLoanInput(loanEl.value);
  });

  const extraEl = document.getElementById("extraInput");
  extraEl.addEventListener("input", () => calc());
  extraEl.addEventListener("blur", () => {
    const n = parseNum(extraEl.value);
    if (n) extraEl.value = formatLoanInput(extraEl.value);
  });

  ["rateInput","termInput","startDateInput"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", () => calc());
  });

  document.getElementById("biweeklyInput").addEventListener("change", () => calc());

  // Term pills
  document.querySelectorAll(".term-pill").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".term-pill").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      const y = btn.dataset.years;
      const customWrap = document.getElementById("customTermWrap");
      if (y === "custom") {
        customWrap.style.display = "block";
        document.getElementById("termInput").focus();
      } else {
        customWrap.style.display = "none";
        document.getElementById("termInput").value = String(parseInt(y, 10) * 12);
      }
      calc();
    });
  });

  // View toggle
  document.getElementById("viewYearBtn").addEventListener("click", () => {
    state.view = "year";
    document.getElementById("viewYearBtn").classList.add("active");
    document.getElementById("viewMonthBtn").classList.remove("active");
    calc();
  });
  document.getElementById("viewMonthBtn").addEventListener("click", () => {
    state.view = "month";
    document.getElementById("viewMonthBtn").classList.add("active");
    document.getElementById("viewYearBtn").classList.remove("active");
    calc();
  });
}

// ============================================================================
// BOOT
// ============================================================================
(function init() {
  // Default start date = today
  const todayStr = new Date().toISOString().slice(0, 10);
  document.getElementById("startDateInput").value = todayStr;
  // Default term value (selected pill is 30 yr)
  document.getElementById("termInput").value = "360";

  applyLang();
  wireHandlers();
})();
</script>
