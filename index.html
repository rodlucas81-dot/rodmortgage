// handles this at the edge; this runs first as the guard for when it doesn't,
// because a partner link landing here silently drops the attribution and the
// disclosure. Runs before anything renders, so there's no flash of this page.

    const slug = new URLSearchParams(location.search).get("r");

})();

<style>
:root {
  /* Blue leads, matching /afford and the rest of rodmortgage.net. Gold stays
     for links and footer labels, exactly as the affordability page uses it. */
  --blue: #1a4fd6;
  --blue2: #2563eb;
  --blue3: #3b7ff5;
  --gold: #d4a843;
  --gold2: #f0c85a;
  --dark: #0b0f18;
  --dark2: #101520;
  --dark3: #181f2e;
  --dark4: #1f2738;
  --cream: #e8edf8;
  --muted: #7a8bae;
  --border: rgba(255,255,255,0.08);
  --green: #4ade80;
  --red: #ff6b6b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--dark);
  color: var(--cream);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: 'Lora', Georgia, serif; font-weight: 700; line-height: 1.2; }

a { color: var(--gold2); text-decoration: none; }
a:hover { color: var(--gold); }

/* TOP BAR */
.topbar {
  background: var(--dark2);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 40px; height: 40px; flex: 0 0 40px;
  background: linear-gradient(135deg, var(--blue3), var(--blue));
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 14px; letter-spacing: -0.5px;
  box-shadow: 0 4px 12px rgba(26, 79, 214, 0.4);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-text strong { font-family: 'Lora', Georgia, serif; color: var(--cream); font-size: 16px; font-weight: 700; }
.brand-text strong .gold { color: var(--gold2); }
.brand-text span { color: var(--muted); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; }
.lang-btn {
  background: transparent; color: var(--cream); border: 1px solid var(--border);
  padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.lang-btn:hover { border-color: var(--blue3); color: #cfe0ff; }

/* CONTAINER */
.wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }

/* HERO */
.badge {
  display: inline-block; background: linear-gradient(135deg, var(--blue), var(--blue2));
  color: #fff; font-weight: 800; font-size: 11px; letter-spacing: 0.08em;
  padding: 6px 12px; border-radius: 999px; margin-bottom: 18px;
}
.hero h1 { font-size: clamp(28px, 6vw, 40px); color: var(--cream); margin-bottom: 14px; }

/* FORM CARD */

}
/* With the question count gone, this bar is the only sense of "how far in am

}

.q-title { font-size: 22px; color: var(--cream); margin-bottom: 6px; }

.choice-grid { display: grid; gap: 10px; }
.choice {
  display: block; width: 100%; text-align: left;
  background: var(--dark3); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; color: var(--cream); font-size: 15px; font-weight: 600;

.field { margin-bottom: 14px; }

.field label .opt { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); opacity: .75; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--dark3); border: 1px solid var(--border);

}
.field textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue3); }
.field .hint { color: var(--blue3); font-size: 12px; font-weight: 600; margin-top: 6px; min-height: 15px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* Month + year stay side by side even on the narrowest phone. */
.my-row { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }

.optout {
  display: block; width: 100%; text-align: left; margin-top: 8px;
  background: transparent; border: 1px dashed rgba(255,255,255,0.18); border-radius: 12px;
  padding: 12px 14px; color: var(--muted); font-size: 13px; font-weight: 600;

}
.optout:hover { border-color: var(--blue3); color: #cfe0ff; }
.optout.selected {
  border-style: solid; border-color: var(--blue3);
  background: rgba(37,99,235,0.14); color: #cfe0ff;
}

.note {
  margin-top: 16px; padding: 12px 14px; border-radius: 10px;
  font-size: 13px; line-height: 1.5; border-left: 3px solid var(--blue3);

.note-ok { border-left-color: var(--green); color: var(--green); }
.note-warn { border-left-color: var(--gold2); }

.consent { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; font-size: 12px; color: var(--muted); line-height: 1.4; }

.nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; }

/* SUCCESS */
.success-icon {
  width: 64px; height: 64px; border-radius: 50%;

}

.nextsteps { margin-top: 8px; }

  font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px;
}
.nextsteps .item p { color: var(--cream); font-size: 13px; line-height: 1.55; }

.calendar-wrap { background: var(--dark3); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-top: 14px; }
.calendar-wrap iframe { display: block; width: 100%; height: 700px; border: 0; background: #fff; }
.calendar-fallback { text-align: center; padding: 12px; color: var(--muted); font-size: 13px; }
.calendar-fallback a { font-weight: 700; }

.success-actions { display: flex; justify-content: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }

/* Document checklist */
.docs { margin-top: 28px; padding: 22px 20px; background: var(--dark3); border: 1px solid var(--border); border-radius: 14px; }
.docs h3 { font-size: 18px; color: var(--cream); margin-bottom: 8px; }
.docs .intro { color: var(--muted); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
.docs .step { padding: 14px 0; border-top: 1px solid var(--border); }
.docs .step:first-of-type { border-top: 0; padding-top: 4px; }
.docs .step h4 {
  font-family: 'Montserrat', sans-serif; font-size: 13px; color: var(--gold);
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
}
.docs .step p { color: var(--cream); font-size: 13px; line-height: 1.55; }

.legal-notice {
  margin-top: 16px; padding: 12px 14px;
  background: var(--dark3); border-left: 3px solid var(--gold);
  border-radius: 8px; font-size: 11px; color: var(--muted); line-height: 1.55;
}
.legal-notice + .legal-notice { margin-top: 8px; }

/* FOOTER — compliance block */
footer {
  margin-top: 40px; padding: 28px 20px 40px;
  border-top: 1px solid var(--border);
  background: var(--dark2);
  color: var(--muted); font-size: 12px; line-height: 1.6;
}
.foot-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.foot-identity { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.foot-block { background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.foot-block .label { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.foot-block .name { color: var(--cream); font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.foot-block .meta { font-size: 11px; color: var(--muted); }
.foot-block .meta a { color: var(--gold2); }
.foot-licenses { background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.foot-licenses .label { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
.foot-licenses .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 11px; }
.foot-licenses .row strong { color: var(--cream); }
.foot-eho { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; }
.foot-eho strong { color: var(--cream); font-size: 12px; }
.foot-legal { font-size: 11px; line-height: 1.65; color: var(--muted); padding: 0 4px; }
.foot-canspam { font-size: 11px; color: var(--muted); padding: 12px 14px; background: var(--dark3); border: 1px solid var(--border); border-radius: 12px; }
.foot-links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; padding: 0 4px; }
.foot-links a { color: var(--gold2); font-weight: 600; }
.foot-copyright { font-size: 11px; color: var(--muted); text-align: center; padding-top: 8px; border-top: 1px solid var(--border); }

.disclosure-pill {
  display: block; background: var(--dark3); border: 1px solid var(--border);
  border-left: 3px solid var(--gold); border-radius: 10px;
  padding: 10px 14px; font-size: 12px; color: var(--muted); margin-bottom: 14px;
  line-height: 1.45;
}

/* RESPONSIVE */
@media (max-width: 540px) {
  .foot-identity { grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  .trust-row { grid-template-columns: 1fr; }

  .trust-pill .dot { font-size: 22px; }
  .trust-pill strong { margin-top: 0; }
  .trust-pill span { margin-top: 0; }
  .field-row, .field-row-3 { grid-template-columns: 1fr; }
}

<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">RD</div>
    <div class="brand-text">
      <strong id="brand-name"></strong>
      <span id="brand-title"></span>
    </div>
  </div>
  <button class="lang-btn" id="lang-btn" type="button"></button>
</div>

<main class="wrap" id="app"></main>

<footer id="site-footer"></footer>

<script>
// ============================================================================
// STATE
// ============================================================================
const STORAGE_KEY = "rod_miniapp_v1";

const BLANK_ANSWERS = {
  // Goal
  purpose: null,
  // Property
  propertyState: null,
  propertyType: null,
  occupancy: null,
  // Numbers — the *Unknown / *Minimum flags mean "I don't know, tell me",
  // which is the whole point of the page for a lot of these borrowers.
  price: "", priceUnknown: false,
  downPayment: "", downMinimum: false,
  value: "", valueUnknown: false,
  balance: "", cashOut: "",
  creditRange: null,
  firstTimeBuyer: null,
  // Income & work — 2 years of history, by dates
  residency: null,
  employment: null,
  employerName: "", businessName: "", jobTitle: "", jobStart: "",
  prevEmployer: "", prevJobStart: "", prevJobEnd: "",
  prevEmployer2: "", prevJobStart2: "", prevJobEnd2: "",
  grossIncome: "", otherIncome: "",
  monthlyDebts: "",
  // Assets — where the money actually is, and whether it's seasoned
  savings: "",
  fundsSource: [],
  seasoning: null,
  giftRelation: "", giftAmount: "",
  // Housing — 2 years of history, with a documentable payment trail
  currentHousing: null,
  housingPayment: "", street: "", city: "", addrState: "", zip: "", moveIn: "",
  rentPay: [], leaseType: "", landlordType: "",
  prevStreet: "", prevCity: "", prevAddrState: "", prevZip: "",
  prevMoveIn: "", prevMoveOut: "", prevHousing: "",
  // Profile
  coBorrower: null,
  coName: "", coIncome: "", coDebts: "", coCredit: "",
  military: null,
  declarations: [],
  // Contact
  firstName: "", lastName: "", email: "", phone: "",
  bestTime: "any", prefLang: "pt", notes: "", consent: false,
};

// This page is aimed at Portuguese speakers, so it opens in Portuguese
// regardless of browser locale (many clients here run English phones).
// ?lang=en opens it in English for sharing with an English-speaking client.
function initialLang() {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "pt") return q;
  } catch (e) { /* no URLSearchParams support — fall through to the default */ }
  return "pt";
}

// Multi-select answers. Each needs its own array instance so a copy of
// BLANK_ANSWERS never shares (and mutates) the template's arrays.
const ARRAY_FIELDS = ["declarations", "fundsSource", "rentPay"];
function freshAnswers() {
  const a = Object.assign({}, BLANK_ANSWERS);
  ARRAY_FIELDS.forEach(k => { a[k] = []; });
  return a;
}

const state = {
  lang: initialLang(),
  view: "hero",          // hero | form | success
  stepId: null,
  answers: freshAnswers(),
  submitting: false,
  submitError: "",
};

function t(key, ...args) {
  let s = i18n[state.lang][key] || i18n.pt[key] || key;
  args.forEach((a, i) => { s = s.replace("{" + i + "}", a); });
  return s;
}

// ============================================================================
// STEP DEFINITIONS
// Each step is one screen. `when` hides a step (or a field) that doesn't apply,
// so a refi borrower never sees purchase questions and vice versa.
// ============================================================================
const PURCHASE_PURPOSES = ["buyFirst", "buyNext", "buyInvest"];
const isPurchase = a => PURCHASE_PURPOSES.includes(a.purpose);
const isRefi = a => a.purpose && !isPurchase(a);
const wantsCash = a => a.purpose === "refiCash" || a.purpose === "heloc";

// Employment types that have an employer/business and therefore a work history
// the lender has to document back 24 months.
const WORKING_EMPLOYMENT = ["w2", "self", "both", "investor"];

// Month/year values are stored as "YYYY-MM".
function monthsSince(ym) {
  if (!/^\d{4}-\d{2}$/.test(String(ym || ""))) return null;
  const parts = String(ym).split("-");
  const now = new Date();
  return (now.getFullYear() - Number(parts[0])) * 12 + (now.getMonth() + 1 - Number(parts[1]));
}

// A previous employer is only worth asking for once we know the current job
// doesn't already cover 24 months — and a second one only if the first still
// doesn't reach back that far.
function needsPrevJob(a, slot) {
  const cur = monthsSince(a.jobStart);
  if (cur == null || cur >= 24) return false;
  if (slot === 1) return true;
  const prev = monthsSince(a.prevJobStart);
  return prev != null && prev < 24;
}

function fmtMonthYear(ym, lang) {
  if (!/^\d{4}-\d{2}$/.test(String(ym || ""))) return "—";
  const parts = String(ym).split("-");
  const names = i18n[lang || "en"].monthNames;
  return names[Number(parts[1]) - 1] + " " + parts[0];
}

const CREDIT_OPTIONS = [
  ["760plus", "sc760"], ["720_759", "sc720"], ["680_719", "sc680"],
  ["640_679", "sc640"], ["620_639", "sc620"], ["below620", "scBelow"],
  ["unknown", "scUnknown"], ["noFile", "scNoFile"],
];

const STEPS = [
  { id: "purpose", section: "secGoal", type: "single", field: "purpose",
    title: "qPurposeTitle", help: "qPurposeHelp", options: [
      ["buyFirst", "purBuyFirst"], ["buyNext", "purBuyNext"], ["buyInvest", "purBuyInvest"],
      ["refiRate", "purRefiRate"], ["refiCash", "purRefiCash"], ["heloc", "purHeloc"],
    ]},

  { id: "propertyState", section: "secProperty", type: "single", field: "propertyState",
    title: "qStateTitle", options: [
      ["FL", "stFL"], ["CT", "stCT"], ["MA", "stMA"], ["OTHER", "stOther"],
    ]},

  { id: "propertyType", section: "secProperty", type: "single", field: "propertyType",
    title: "qPropTypeTitle", help: "qPropTypeHelp", options: [
      ["single", "ptSingle"], ["townhouse", "ptTownhouse"], ["condo", "ptCondo"],
      ["multi", "ptMulti"], ["manufactured", "ptManufactured"], ["land", "ptLand"],
    ]},

  { id: "occupancy", section: "secProperty", type: "single", field: "occupancy",
    title: "qOccupancyTitle", help: "qOccupancyHelp", options: [
      ["primary", "occPrimary"], ["second", "occSecond"], ["investment", "occInvestment"],
    ]},

  { id: "moneyBuy", section: "secMoney", type: "fields", when: isPurchase,
    title: "qMoneyBuyTitle", help: "qMoneyBuyHelp", fields: [
      { k: "price", label: "fPrice", kind: "money", required: true,
        optOut: { k: "priceUnknown", label: "optPriceUnknown" } },
      { k: "downPayment", label: "fDown", kind: "money", required: true,
        optOut: { k: "downMinimum", label: "optDownMinimum" } },
    ]},

  { id: "moneyRefi", section: "secMoney", type: "fields", when: isRefi,
    title: "qMoneyRefiTitle", help: "qMoneyRefiHelp", fields: [
      { k: "value", label: "fValue", kind: "money", required: true,
        optOut: { k: "valueUnknown", label: "optValueUnknown" } },
      { k: "balance", label: "fBalance", kind: "money", required: true },
      { k: "cashOut", label: "fCashOut", kind: "money", required: true, when: wantsCash },
    ]},

  { id: "credit", section: "secMoney", type: "single", field: "creditRange",
    title: "qCreditTitle", help: "qCreditHelp", options: CREDIT_OPTIONS },

  { id: "firstTime", section: "secMoney", type: "single", field: "firstTimeBuyer",
    when: isPurchase, title: "qFirstTimeTitle", help: "qFirstTimeHelp", options: [
      ["yes", "ftYes"], ["no", "ftNo"],
    ]},

  { id: "residency", section: "secIncome", type: "single", field: "residency",
    title: "qResidencyTitle", help: "qResidencyHelp", options: [
      ["citizen", "resCitizen"], ["pr", "resPR"], ["ead", "resEAD"],
      ["itin", "resITIN"], ["foreign", "resForeign"], ["other", "resOther"],
    ]},

  { id: "employment", section: "secIncome", type: "single", field: "employment",
    title: "qEmploymentTitle", help: "qEmploymentHelp", options: [
      ["w2", "empW2"], ["self", "empSelf"], ["both", "empBoth"],
      ["retired", "empRetired"], ["investor", "empInvestor"], ["none", "empNone"],
    ]},

  // Work history is asked by DATE, not by "how long roughly" — because the
  // 24-month rule is what actually gets documented, and the dates tell us
  // whether a previous employer is needed at all.
  { id: "jobCurrent", section: "secIncome", type: "fields",
    when: a => WORKING_EMPLOYMENT.includes(a.employment),
    title: "qJobCurrentTitle", help: "qJobCurrentHelp", fields: [
      { k: "employerName", label: "fEmployerName", kind: "text", required: true,
        when: a => a.employment === "w2" || a.employment === "both" },
      { k: "businessName", label: "fBusinessName", kind: "text", required: true,
        when: a => a.employment === "self" || a.employment === "both" || a.employment === "investor" },
      { k: "jobTitle", label: "fJobTitle", kind: "text" },
      { k: "jobStart", kind: "monthYear", required: true,
        label: a => (a.employment === "self" || a.employment === "investor") ? "fBusinessStart" : "fJobStart" },
    ],
    note: a => monthsSince(a.jobStart) == null ? null
      : (monthsSince(a.jobStart) >= 24 ? { key: "jobCoveredNote", tone: "ok" }
                                       : { key: "jobShortNote", tone: "warn" }) },

  { id: "prevJob", section: "secIncome", type: "fields",
    when: a => WORKING_EMPLOYMENT.includes(a.employment) && needsPrevJob(a, 1),
    title: "qPrevJobTitle", help: "qPrevJobHelp", fields: [
      { k: "prevEmployer", label: "fPrevEmployer", kind: "text", required: true },
      { k: "prevJobStart", label: "fPrevJobStart", kind: "monthYear", required: true, half: true },
      { k: "prevJobEnd", label: "fPrevJobEnd", kind: "monthYear", required: true, half: true, notBefore: "prevJobStart" },
    ],
    note: () => ({ key: "gapNote", tone: "muted" }) },

  { id: "prevJob2", section: "secIncome", type: "fields",
    when: a => WORKING_EMPLOYMENT.includes(a.employment) && needsPrevJob(a, 2),
    title: "qPrevJob2Title", help: "qPrevJob2Help", fields: [
      { k: "prevEmployer2", label: "fPrevEmployer", kind: "text", required: true },
      { k: "prevJobStart2", label: "fPrevJobStart", kind: "monthYear", required: true, half: true },
      { k: "prevJobEnd2", label: "fPrevJobEnd", kind: "monthYear", required: true, half: true, notBefore: "prevJobStart2" },
    ]},

  { id: "income", section: "secIncome", type: "fields",
    title: "qIncomeTitle", help: "qIncomeHelp", fields: [
      { k: "grossIncome", label: "fGrossIncome", kind: "money", required: true },
      { k: "otherIncome", label: "fOtherIncome", kind: "money" },
    ]},

  { id: "debts", section: "secIncome", type: "fields",
    title: "qDebtsTitle", help: "qDebtsHelp", fields: [
      { k: "monthlyDebts", label: "fMonthlyDebts", kind: "money", required: true },
    ]},

  { id: "assets", section: "secAssets", type: "fields",
    title: "qAssetsTitle", help: "qAssetsHelp", fields: [
      { k: "savings", label: "fSavings", kind: "money", required: true },
    ]},

  { id: "fundsSource", section: "secAssets", type: "multi", field: "fundsSource",
    title: "qFundsTitle", help: "qFundsHelp", options: [
      ["bank", "fundBank"], ["cash", "fundCash"], ["otherPerson", "fundOtherPerson"],
      ["sale", "fundSale"], ["retirement", "fundRetirement"], ["abroad", "fundAbroad"],

function activeSteps() {
  return STEPS.filter(s => !s.when || s.when(state.answers));
}
function activeFields(step) {
  return (step.fields || []).filter(f => !f.when || f.when(state.answers));
}
function currentIndex() {
  const as = activeSteps();
  const i = as.findIndex(s => s.id === state.stepId);
  return i < 0 ? 0 : i;
}
function currentStep() {
  return activeSteps()[currentIndex()];
}
function sectionInfo(step) {
  const secs = [];
  activeSteps().forEach(s => { if (!secs.includes(s.section)) secs.push(s.section); });
  return { index: secs.indexOf(step.section) + 1, total: secs.length, name: t(step.section) };
}

// ============================================================================
// NUMBER HELPERS
// Borrowers type "450.000", "450,000", "$450k" — take the digits and move on.
// ============================================================================
function parseMoney(v) {
  const raw = String(v == null ? "" : v);
  const digits = raw.replace(/[^\d]/g, "");
  if (digits === "") return null;
  // "450 mil", "45k", "1 milhão" — common shorthand in both languages.
  // The formatted hint under the field shows the result, so a wrong guess
  // is visible to the borrower before they move on.
  let mult = 1;
  if (/milh|million/i.test(raw)) mult = 1000000;
  else if (/\bmil\b|\d\s*[km]\b/i.test(raw)) mult = 1000;
  if (mult === 1) return Number(digits);
  // With a multiplier, a separator is a decimal point ("1,5 mil" = 1500) —
  // without one it's a thousands separator ("450.000" = 450000).
  const m = raw.match(/(\d+)(?:[.,](\d+))?/);
  const base = m[2] ? Number(m[1] + "." + m[2]) : Number(m[1]);
  return Math.round(base * mult);
}
function num(v) {
  const n = parseMoney(v);
  return n == null ? 0 : n;
}
function fmtUSD(n) {
  if (n == null || isNaN(n)) return "";
  return "$" + Math.round(n).toLocaleString("en-US");
}
function fmtPct(x, digits) {
  if (x == null || !isFinite(x)) return "n/a";
  return (x * 100).toFixed(digits == null ? 1 : digits) + "%";
}

// ============================================================================
// DERIVED NUMBERS — for the advisor's lead summary only. Never shown as a quote.
// ============================================================================
function derived(a) {
  const purchase = isPurchase(a);
  // Blank stays null so the summary asks for the analysis instead of printing
  // $0 — but a ballpark typed alongside "tell me my maximum" is still used.
  const propValue = purchase ? parseMoney(a.price) : parseMoney(a.value);
  const down = purchase ? parseMoney(a.downPayment) : null;

  let loanAmount = null;
  if (purchase) {
    if (propValue != null && down != null) loanAmount = Math.max(0, propValue - down);
  } else {
    loanAmount = num(a.balance) + num(a.cashOut);
  }

  const income = num(a.grossIncome) + num(a.otherIncome) + num(a.coIncome);
  const debts = num(a.monthlyDebts) + num(a.coDebts);
  const cashNeeded = (purchase && propValue != null && down != null)
    ? down + propValue * CONFIG.estClosingCostPct
    : null;

  return {
    purchase,
    wantsMaxPrice: purchase && !!a.priceUnknown,
    wantsMinDown: purchase && !!a.downMinimum,
    propValue,
    down,
    downPct: (propValue && down != null) ? down / propValue : null,
    loanAmount,
    ltv: (propValue && loanAmount != null) ? loanAmount / propValue : null,
    totalIncome: income,
    totalDebts: debts,
    debtRatio: income > 0 ? debts / income : null,
    cashNeeded,
    cashGap: cashNeeded == null ? null : num(a.savings) - cashNeeded,
    monthsAtJob: monthsSince(a.jobStart),
    monthsAtAddress: monthsSince(a.moveIn),
  };
}

// ============================================================================
// UNDERWRITING FLAGS — the triage list, so the file's real obstacles are
// visible in the email instead of surfacing three weeks into processing.
// ============================================================================
function buildFlags(a, d) {
  const f = [];
  const funds = a.fundsSource || [];
  const rent = a.rentPay || [];

  if (d.wantsMaxPrice) {
    f.push("ASK: wants to know MAX PURCHASE PRICE — " +
           (d.propValue == null ? "no price stated." : "their own ballpark is " + fmtUSD(d.propValue) + "."));
  }
  if (d.wantsMinDown) {
    f.push("ASK: wants the MINIMUM DOWN PAYMENT for whatever program fits" +
           (d.down == null ? "." : " — was planning on " + fmtUSD(d.down) + "."));
  }
  if (a.valueUnknown) {
    f.push("ASK: doesn't know current home value — " +
           (d.propValue == null ? "needs an estimate/AVM." : "guessed " + fmtUSD(d.propValue) + "; confirm with an AVM."));
  }

  if (funds.includes("cash")) f.push("FUNDS: cash held outside a bank — not usable until ~60 days seasoned.");
  if (funds.includes("otherPerson")) {
    f.push("FUNDS: gift from " + (a.giftRelation || "unspecified") +
           (parseMoney(a.giftAmount) != null ? " (" + fmtUSD(parseMoney(a.giftAmount)) + ")" : "") +
           " — needs gift letter + donor's statement.");
  }
  if (funds.includes("abroad")) f.push("FUNDS: coming from outside the U.S. — extra transfer/sourcing docs.");
  if (funds.includes("loan")) f.push("FUNDS: borrowed — payment counts against DTI; may not be allowed as down payment.");
  if (funds.includes("sale")) f.push("FUNDS: from a sale — needs closing statement / bill of sale.");
  if (funds.includes("retirement")) f.push("FUNDS: retirement account — needs terms of withdrawal or loan.");
  if (funds.includes("saving")) f.push("FUNDS: still being saved — not yet in hand.");
  if (a.seasoning === "under2") f.push("FUNDS: in the account under 2 months — large deposits need an LOE + paper trail.");
  if (a.seasoning === "notYet") f.push("FUNDS: not in a bank account yet — seasoning clock hasn't started.");
  if (a.seasoning === "mixed") f.push("FUNDS: partly seasoned — needs a breakdown by account.");

  if (d.monthsAtJob != null && d.monthsAtJob < 24) {
    f.push("WORK: " + d.monthsAtJob + " months at current job — prior employment " +
           (a.prevEmployer ? "captured (" + a.prevEmployer + ")" : "NOT captured") + ".");
  }
  if (a.employment === "self" || a.employment === "both") {
    f.push("WORK: self-employed — 2 years of returns, or a bank-statement program.");
  }
  if (a.employment === "none") f.push("WORK: no documented income stated.");

  if (a.currentHousing === "rent") {
    if (rent.includes("cash")) f.push("RENT: paid in cash — no bank trail for a VOR. Biggest obstacle on this file.");
    if (rent.includes("venmo")) f.push("RENT: paid via Venmo/Cash App — check whether the trail is documentable.");
    if (a.landlordType === "private" || a.landlordType === "family") {
      f.push("RENT: private/family landlord — VOR likely needs 12 months of cancelled checks or bank proof.");
    }
    if (a.leaseType === "none") f.push("RENT: no written lease.");
  }
  if (d.monthsAtAddress != null && d.monthsAtAddress < 24) {
    f.push("HOUSING: " + d.monthsAtAddress + " months at current address — prior address " +
           (a.prevStreet ? "captured" : "NOT captured") + ".");
  }

  if (a.residency === "itin" || a.residency === "foreign") f.push("PROFILE: ITIN / foreign national — non-QM program.");
  if (a.propertyState === "OTHER") f.push("PROFILE: property outside CT/FL/MA — check licensing.");
  if (a.creditRange === "noFile") f.push("CREDIT: no U.S. credit history — needs alternative tradelines.");
  if (a.creditRange === "below620") f.push("CREDIT: stated below 620.");
  if (a.creditRange === "unknown") f.push("CREDIT: borrower doesn't know their score.");
  if (d.cashGap != null && d.cashGap < 0) f.push("CASH: short by " + fmtUSD(Math.abs(d.cashGap)) + " vs. down + est. closing.");

  const decl = (a.declarations || []).filter(x => x !== "none");
  if (decl.length) f.push("DECLARATIONS: " + decl.join(", ") + " — check waiting periods.");

  return f;
}

// ============================================================================
// PERSISTENCE — answers stay in the borrower's browser until they submit.
// ============================================================================
function saveDraft() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers: state.answers, stepId: state.stepId, view: state.view, lang: state.lang,
    }));
  } catch (e) { /* private mode — draft saving is a convenience, not a requirement */ }
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && d.answers) {
      state.answers = Object.assign(freshAnswers(), d.answers);
      ARRAY_FIELDS.forEach(k => {
        if (!Array.isArray(state.answers[k])) state.answers[k] = [];
      });
    }
    // An explicit ?lang= in the URL outranks whatever the draft remembered.
    const forced = new URLSearchParams(location.search).get("lang");
    if (d && d.lang && forced !== "en" && forced !== "pt") state.lang = d.lang;
    if (d && d.view === "form" && d.stepId) { state.view = "form"; state.stepId = d.stepId; }
  } catch (e) { /* corrupt draft — start fresh */ }
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, ch =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function renderForm() {
  const steps = activeSteps();
  const idx = currentIndex();
  const step = steps[idx];
  const isLast = idx === steps.length - 1;
  const sec = sectionInfo(step);
  const pct = ((idx + 1) / steps.length) * 100;

  let body = "";
  if (step.type === "single") body = renderSingle(step);
  else if (step.type === "multi") body = renderMulti(step);
  else if (step.type === "fields") body = renderFields(step);
  else body = renderContact(step);

  // Single-select steps advance on click, so they need no Next button.
  const needsNext = step.type !== "single";
  // Contextual coaching: cash funds, a short work history, rent paid in cash.
  const note = typeof step.note === "function" ? step.note(state.answers) : null;

  return `
    <section class="card">
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"
        aria-valuenow="${Math.round(pct)}" aria-label="${escapeHtml(t("progressLabel"))}">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <div class="meta-row">
        <span class="section-chip">${t("sectionLabel", sec.index, sec.total, sec.name)}</span>
        <span class="step-meta">${Math.round(pct)}%</span>
      </div>
      <h2 class="q-title">${t(step.title)}</h2>
      ${step.help ? `<p class="q-help">${t(step.help)}</p>` : ""}
      ${body}
      ${note ? `<div class="note note-${note.tone}">${t(note.key)}</div>` : ""}
      <div class="nav-row">
        ${idx > 0 ? `<button class="btn-secondary" id="back-btn" type="button">${t("back")}</button>` : "<span></span>"}
        ${isLast
          ? `<button class="btn-primary" id="submit-btn" type="button" style="width:auto;padding:14px 22px;"${state.submitting ? " disabled" : ""}>${state.submitting ? t("submitting") : t("submitBtn")}</button>`
          : (needsNext
              ? `<button class="btn-primary" id="next-btn" type="button" style="width:auto;padding:14px 22px;">${t("next")}</button>`
              : "<span></span>")}
      </div>
      <div class="error" id="step-error">${escapeHtml(state.submitError)}</div>
    </section>
  `;
}

function renderSingle(step) {
  const cur = state.answers[step.field];
  return `<div class="choice-grid">${step.options.map(([v, key]) => `
    <button type="button" class="choice ${cur === v ? "selected" : ""}" data-field="${step.field}" data-value="${v}">
      ${t(key)}
    </button>`).join("")}</div>`;
}

function renderMulti(step) {
  const picked = state.answers[step.field] || [];
  return `<div class="choice-grid">${step.options.map(([v, key]) => `
    <button type="button" class="choice ${picked.includes(v) ? "selected" : ""}" data-multi="${v}">
      ${t(key)}
    </button>`).join("")}</div>`;
}

function fieldLabel(f) {
  const a = state.answers;
  const key = typeof f.label === "function" ? f.label(a) : f.label;
  // Taking the "I don't know" option makes the number optional, not forbidden —
  // a borrower can still hand over a ballpark for me to work from.
  const optional = !f.required || !!(f.optOut && a[f.optOut.k]);
  return t(key) + (optional ? ` <span class="opt">(${t("optional")})</span>` : "");
}

function monthYearHtml(f) {
  const cur = String(state.answers[f.k] || "");
  const parts = cur.split("-");
  const curY = parts[0] || "", curM = parts[1] || "";
  const names = i18n[state.lang].monthNames;
  const thisYear = new Date().getFullYear();
  const years = [];
  for (let y = thisYear; y >= thisYear - 50; y--) years.push(y);
  return `
    <div class="field">
      <label>${fieldLabel(f)}</label>
      <div class="my-row">
        <select id="f-${f.k}-m" data-my="${f.k}" aria-label="${escapeHtml(t("monthLabel"))}">
          <option value="">${t("monthLabel")}</option>
          ${names.map((nm, i) => {
            const v = String(i + 1).padStart(2, "0");
            return `<option value="${v}" ${curM === v ? "selected" : ""}>${nm}</option>`;
          }).join("")}
        </select>
        <select id="f-${f.k}-y" data-my="${f.k}" aria-label="${escapeHtml(t("yearLabel"))}">
          <option value="">${t("yearLabel")}</option>
          ${years.map(y => `<option value="${y}" ${curY === String(y) ? "selected" : ""}>${y}</option>`).join("")}
        </select>
      </div>
    </div>`;
}

function fieldHtml(f) {
  const a = state.answers;
  const label = fieldLabel(f);

  if (f.kind === "monthYear") return monthYearHtml(f);

  if (f.kind === "select") {
    return `
      <div class="field">
        <label for="f-${f.k}">${label}</label>
        <select id="f-${f.k}" data-key="${f.k}">
          ${f.selectOptions.map(([v, key]) =>
            `<option value="${v}" ${a[f.k] === v ? "selected" : ""}>${t(key)}</option>`).join("")}
        </select>
      </div>`;
  }

  // "I don't know — tell me" sits alongside the input rather than replacing it,
  // so a borrower can ask for their maximum and still give me a ballpark.
  const opted = !!(f.optOut && a[f.optOut.k]);
  const isMoney = f.kind === "money";
  const inputMode = isMoney || f.kind === "number" ? "numeric" : "text";
  const hint = isMoney && parseMoney(a[f.k]) != null ? fmtUSD(parseMoney(a[f.k])) : "";
  return `
    <div class="field">
      <label for="f-${f.k}">${label}</label>
      <input id="f-${f.k}" data-key="${f.k}" type="text" inputmode="${inputMode}"
        value="${escapeHtml(a[f.k])}"${f.autocomplete ? ` autocomplete="${f.autocomplete}"` : ""} />
      ${isMoney ? `<div class="hint" id="hint-${f.k}">${hint}</div>` : ""}
      ${f.optOut ? `<button type="button" class="optout ${opted ? "selected" : ""}"
        data-optout="${f.optOut.k}" data-optout-field="${f.k}">${opted ? "✓ " : ""}${t(f.optOut.label)}</button>
      ${opted ? `<div class="hint">${t("optChosenNote")}</div>` : ""}` : ""}
    </div>`;
}

function renderFields(step) {
  const fields = activeFields(step);
  // Fields flagged `half` pair up two-per-row on desktop; the rest go full width.
  let html = "";
  let i = 0;
  while (i < fields.length) {
    const f = fields[i];
    if (f.half && fields[i + 1] && fields[i + 1].half) {
      html += `<div class="field-row">${fieldHtml(f)}${fieldHtml(fields[i + 1])}</div>`;
      i += 2;
    } else {
      html += fieldHtml(f);
      i += 1;
    }
  }
  return html;
}

function renderContact(step) {
  const a = state.answers;
  return `
    <div class="field-row">

// ============================================================================
// HANDLERS
// ============================================================================
function goTo(idx) {
  const steps = activeSteps();
  const clamped = Math.max(0, Math.min(idx, steps.length - 1));
  state.stepId = steps[clamped].id;
  state.submitError = "";
  saveDraft();
  render();
}

function wireHandlers() {
  document.getElementById("lang-btn").onclick = () => {
    state.lang = state.lang === "pt" ? "en" : "pt";
    saveDraft();
    render();
  };

  if (state.view === "hero") {
    const b = document.getElementById("start-btn");
    if (b) b.onclick = () => {
      state.view = "form";
      state.stepId = activeSteps()[0].id;
      saveDraft();
      render();
    };
    return;
  }

  if (state.view === "success") {
    const r = document.getElementById("restart-btn");
    if (r) r.onclick = () => {
      state.answers = freshAnswers();
      state.view = "hero";
      state.stepId = null;
      state.submitError = "";
      clearDraft();
      render();
    };
    return;
  }

  const step = currentStep();

  // Single-select: pick and advance.
  document.querySelectorAll(".choice[data-field]").forEach(btn => {
    btn.onclick = () => {
      state.answers[btn.dataset.field] = btn.dataset.value;
      state.submitError = "";
      saveDraft();
      goTo(currentIndex() + 1);
    };
  });

  // Multi-select: toggle, with mutually exclusive options (e.g. "None of these").
  document.querySelectorAll(".choice[data-multi]").forEach(btn => {
    btn.onclick = () => {
      const v = btn.dataset.multi;
      const excl = step.exclusive || [];
      const cur = state.answers[step.field] || [];
      if (excl.includes(v)) {
        state.answers[step.field] = cur.includes(v) ? [] : [v];
      } else {
        const kept = cur.filter(x => !excl.includes(x));
        state.answers[step.field] = kept.includes(v)
          ? kept.filter(x => x !== v)
          : kept.concat([v]);
      }
      state.submitError = "";
      saveDraft();
      render();
    };
  });

  // Text / money / select inputs write straight to state so typing never
  // triggers a re-render (which would steal focus mid-word).
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.dataset.key;
    const handler = e => {
      state.answers[key] = e.target.value;
      const hint = document.getElementById("hint-" + key);
      if (hint) {
        const n = parseMoney(e.target.value);
        hint.textContent = n == null ? "" : fmtUSD(n);
      }
      saveDraft();
    };
    el.oninput = handler;
    el.onchange = handler;
  });

  // "I don't know" toggles: turning one on clears whatever was typed.
  document.querySelectorAll("[data-optout]").forEach(btn => {
    btn.onclick = () => {
      // Toggling this keeps whatever was typed — the two answers coexist.
      const key = btn.dataset.optout;
      state.answers[key] = !state.answers[key];
      state.submitError = "";
      saveDraft();
      render();
    };
  });

  // Month/year pairs re-render on change: a start date decides whether the
  // previous-employer or previous-address step is needed at all.
  document.querySelectorAll("[data-my]").forEach(sel => {
    sel.onchange = () => {
      const k = sel.dataset.my;
      const m = document.getElementById("f-" + k + "-m").value;
      const y = document.getElementById("f-" + k + "-y").value;
      const before = state.answers[k];
      // A half-filled pair is stored as "YYYY-" or "-MM" so the part already
      // picked survives a re-render; monthsSince() treats it as unanswered.
      const after = (m || y) ? (y + "-" + m) : "";
      state.answers[k] = after;
      state.submitError = "";
      saveDraft();
      // Only a complete date changes which steps follow, so don't re-render
      // (and reset the other dropdown) while the pair is still half-filled.
      if (monthsSince(before) != null || monthsSince(after) != null) render();
    };
  });

  const consent = document.getElementById("f-consent");
  if (consent) consent.onchange = e => { state.answers.consent = e.target.checked; saveDraft(); };

  const back = document.getElementById("back-btn");
  if (back) back.onclick = () => goTo(currentIndex() - 1);

  const next = document.getElementById("next-btn");
  if (next) next.onclick = () => {
    if (!validateStep(step)) { render(); return; }
    goTo(currentIndex() + 1);
  };

  const submit = document.getElementById("submit-btn");
  if (submit) submit.onclick = () => {
    if (!validateStep(step)) { render(); return; }
    handleSubmit();
  };
}

function validateStep(step) {
  const a = state.answers;
  if (step.type === "single") {
    if (!a[step.field]) { state.submitError = t("fieldErr"); return false; }
    return true;
  }
  if (step.type === "multi") {
    if (!a[step.field] || a[step.field].length === 0) { state.submitError = t("multiErr"); return false; }
    return true;
  }
  if (step.type === "fields") {
    for (const f of activeFields(step)) {
      if (f.optOut && a[f.optOut.k]) continue;   // answered by "I don't know"
      if (f.kind === "monthYear") {
        const months = monthsSince(a[f.k]);
        if (f.required && months == null) { state.submitError = t("dateErr"); return false; }
        if (months != null && months < 0) { state.submitError = t("dateFutureErr"); return false; }
        if (f.notBefore && months != null) {
          const other = monthsSince(a[f.notBefore]);
          // Fewer months elapsed means a later date, so an end date must not
          // sit further back in time than its start date.
          if (other != null && months > other) { state.submitError = t("dateOrderErr"); return false; }
        }
        continue;
      }
      if (!f.required) continue;
      if (f.kind === "money" || f.kind === "number") {
        if (parseMoney(a[f.k]) == null) { state.submitError = t("numberErr"); return false; }
      } else if (!String(a[f.k] || "").trim()) {
        state.submitError = t("textErr");
        return false;
      }
    }
    return true;
  }
  // Contact
  if (!String(a.firstName).trim() || !String(a.lastName).trim()) { state.submitError = t("textErr"); return false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a.email)) { state.submitError = t("emailErr"); return false; }
  if (String(a.phone).replace(/\D/g, "").length < 10) { state.submitError = t("phoneErr"); return false; }
  if (!a.consent) { state.submitError = t("consentErr"); return false; }
  return true;
}

// ============================================================================
// LEAD SUMMARY — always English, so the advisor's inbox reads the same
// regardless of which language the borrower filled the form in.
// ============================================================================
function en(key) { return i18n.en[key] || key; }

function labelFor(step, value) {
  const opt = (step.options || []).find(o => o[0] === value);
  return opt ? en(opt[1]) : (value || "—");
}

function buildLeadSummary(a) {
  const d = derived(a);
  const L = [];
  L.push("MINI MORTGAGE APPLICATION (pre-qualification inquiry)");
  L.push("Submitted: " + new Date().toLocaleString("en-US"));
  L.push("Form language: " + (state.lang === "pt" ? "Portuguese" : "English") +
         " · Prefers to be contacted in: " + ({ pt: "Portuguese", en: "English", es: "Spanish" }[a.prefLang] || a.prefLang));
  L.push("");
  L.push("--- BORROWER ---");
  L.push("Name: " + a.firstName + " " + a.lastName);
  L.push("Email: " + a.email);
  L.push("Phone: " + a.phone + "  (best time: " + a.bestTime + ")");
  L.push("");

  let lastSection = null;
  activeSteps().forEach(step => {
    if (step.type === "contact") return;
    if (step.section !== lastSection) {
      L.push("");
      L.push("--- " + en(step.section).toUpperCase() + " ---");
      lastSection = step.section;
    }
    if (step.type === "single") {
      L.push(en(step.title) + " " + labelFor(step, a[step.field]));
    } else if (step.type === "multi") {
      const picked = (a[step.field] || []).map(v => labelFor(step, v));
      L.push(en(step.title) + " " + (picked.length ? picked.join("; ") : "—"));
    } else if (step.type === "fields") {
      // The step title distinguishes otherwise identical field sets — two
      // previous employers, current vs. previous address.
      L.push(en(step.title));
      activeFields(step).forEach(f => {
        const labelKey = typeof f.label === "function" ? f.label(a) : f.label;
        if (f.optOut && a[f.optOut.k]) {
          const typed = parseMoney(a[f.k]);
          L.push("  " + en(labelKey).replace(/\s*[?:]\s*$/, "") + ": >> " +
                 en(f.optOut.label).toUpperCase() + " <<" +
                 (typed == null ? "" : "  (their ballpark: " + fmtUSD(typed) + ")"));
          return;
        }
        let v = a[f.k];
        if (f.kind === "money") v = parseMoney(v) == null ? "—" : fmtUSD(parseMoney(v));
        else if (f.kind === "monthYear") {
          const m = monthsSince(v);
          v = fmtMonthYear(v, "en") + (m == null ? "" : "  (" + m + " months ago)");
        } else if (f.kind === "select") {
          const opt = (f.selectOptions || []).find(o => o[0] === v);
          v = opt ? en(opt[1]) : (v || "—");
        } else v = String(v || "—");
        L.push("  " + en(labelKey).replace(/\s*[?:]\s*$/, "") + ": " + v);
      });
    }
  });

  const flags = buildFlags(a, d);
  if (flags.length) {
    L.push("");
    L.push("--- FLAGS / TO VERIFY ---");
    flags.forEach(x => L.push("  * " + x));
  }

  const orDash = v => (v == null ? "—" : fmtUSD(v));
  L.push("");
  L.push("--- CALCULATED (from borrower estimates) ---");
  L.push("Transaction: " + (d.purchase ? "Purchase" : "Refinance / equity"));
  const askSuffix = (asking, label) =>
    asking ? (d.propValue == null && d.down == null ? "" : "") + "   [" + label + "]" : "";
  L.push("Property value: " +
         (d.propValue == null ? (d.wantsMaxPrice || a.valueUnknown ? "NOT STATED" : "—") : orDash(d.propValue)) +
         askSuffix(d.wantsMaxPrice, "WANTS MAX QUALIFICATION") +
         askSuffix(a.valueUnknown && !d.purchase, "DOESN'T KNOW VALUE"));
  if (d.purchase) {
    L.push("Down payment: " +
           (d.down == null ? "NOT STATED" : orDash(d.down) + " (" + fmtPct(d.downPct) + ")") +
           askSuffix(d.wantsMinDown, "WANTS PROGRAM MINIMUM"));
  }
  L.push("Estimated loan amount: " + orDash(d.loanAmount));
  L.push("Estimated LTV: " + fmtPct(d.ltv));
  L.push("Total monthly income (all borrowers): " + fmtUSD(d.totalIncome));
  L.push("Total monthly debts (all borrowers): " + fmtUSD(d.totalDebts));
  L.push("Debt ratio BEFORE housing: " + fmtPct(d.debtRatio));
  L.push("Funds stated available: " + fmtUSD(num(a.savings)));
  if (d.cashNeeded != null) {
    L.push("Cash needed (down + ~" + fmtPct(CONFIG.estClosingCostPct, 0) + " closing): " + fmtUSD(d.cashNeeded));
    L.push("  →  " + (d.cashGap >= 0 ? "surplus " + fmtUSD(d.cashGap) : "SHORT by " + fmtUSD(Math.abs(d.cashGap))));
  }
  L.push("Months at current job: " + (d.monthsAtJob == null ? "—" : d.monthsAtJob + " (needs 24 total)"));
  L.push("Months at current address: " + (d.monthsAtAddress == null ? "—" : d.monthsAtAddress + " (needs 24 total)"));

  if (String(a.notes || "").trim()) {
    L.push("");
    L.push("--- BORROWER NOTES ---");
    L.push(a.notes);
  }

  L.push("");
  L.push("Consent to contact (calls/SMS/email): " + (a.consent ? "YES" : "no"));
  L.push("Source: rodmortgage.netlify.app (mini application)");
  L.push("NOTE: No SSN, DOB or credit report collected. This is not a Form 1003 and no credit decision was made.");
  return L.join("\n");
}

  state.submitting = true;
  state.submitError = "";
  render();

  const d = derived(a);
  const payload = {
    // Title Case keys mirror the affordability page so both lead types read

    "_subject": "Mini App (" + (state.lang === "pt" ? "PT" : "EN") + "): " +
              a.firstName + " " + a.lastName + " — " +
              (isPurchase(a) ? "Purchase" : "Refi") + " — " + (a.propertyState || "?"),
    "Lead Type": "Mini Application (pre-qualification)",
    "Name": (a.firstName + " " + a.lastName).trim(),
    "First Name": a.firstName,
    "Last Name": a.lastName,
    "Email": a.email,
    "Phone": a.phone,
    "Best Time to Call": a.bestTime,
    "Language": state.lang.toUpperCase(),
    "TCPA Consent": a.consent ? "Yes — granted on submit" : "No",
    "Lead Summary": buildLeadSummary(a),

    name: (a.firstName + " " + a.lastName).trim(),
    email: a.email,
    phone: a.phone,
    bestTime: a.bestTime,
    preferredLanguage: a.prefLang,
    formLanguage: state.lang,

    purpose: a.purpose,
    propertyState: a.propertyState,
    propertyType: a.propertyType,
    occupancy: a.occupancy,
    creditRange: a.creditRange,
    firstTimeBuyer: a.firstTimeBuyer,
    residency: a.residency,
    employment: a.employment,
    currentHousing: a.currentHousing,
    coBorrower: a.coBorrower,
    military: a.military,
    declarations: (a.declarations || []).join(", "),

    wantsMaxPurchasePrice: a.priceUnknown ? "yes" : "no",
    wantsMinimumDown: a.downMinimum ? "yes" : "no",

    fundsSource: (a.fundsSource || []).join(", "),
    fundsSeasoning: a.seasoning,
    giftRelation: a.giftRelation,
    giftAmount: parseMoney(a.giftAmount),

    employerName: a.employerName,
    businessName: a.businessName,
    jobTitle: a.jobTitle,
    jobStart: a.jobStart,
    monthsAtCurrentJob: d.monthsAtJob,
    prevEmployer: a.prevEmployer,
    prevJobStart: a.prevJobStart,
    prevJobEnd: a.prevJobEnd,
    prevEmployer2: a.prevEmployer2,
    prevJobStart2: a.prevJobStart2,
    prevJobEnd2: a.prevJobEnd2,

    rentPaidBy: (a.rentPay || []).join(", "),
    leaseType: a.leaseType,
    landlordType: a.landlordType,
    moveInDate: a.moveIn,
    monthsAtCurrentAddress: d.monthsAtAddress,
    previousAddress: [a.prevStreet, a.prevCity, a.prevAddrState, a.prevZip].filter(Boolean).join(", "),
    previousAddressFrom: a.prevMoveIn,
    previousAddressTo: a.prevMoveOut,
    previousHousingType: a.prevHousing,

    purchasePrice: parseMoney(a.price),
    downPayment: parseMoney(a.downPayment),
    propertyValue: parseMoney(a.value),
    mortgageBalance: parseMoney(a.balance),
    cashOut: parseMoney(a.cashOut),
    grossMonthlyIncome: parseMoney(a.grossIncome),
    otherMonthlyIncome: parseMoney(a.otherIncome),
    monthlyDebts: parseMoney(a.monthlyDebts),
    fundsAvailable: parseMoney(a.savings),
    currentHousingPayment: parseMoney(a.housingPayment),
    currentAddress: [a.street, a.city, a.addrState, a.zip].filter(Boolean).join(", "),
    coBorrowerName: a.coName,
    coBorrowerIncome: parseMoney(a.coIncome),
    coBorrowerDebts: parseMoney(a.coDebts),
    coBorrowerCredit: a.coCredit,

    estimatedLoanAmount: d.loanAmount,
    estimatedLTV: d.ltv == null ? null : fmtPct(d.ltv),
    debtRatioBeforeHousing: d.debtRatio == null ? null : fmtPct(d.debtRatio),

    notes: a.notes,
    consentGiven: a.consent ? "yes" : "no",
    leadSummary: buildLeadSummary(a),
    source: "rodmortgage.netlify.app (mini application)",
  };

  try {
    // Same two-tier delivery the affordability page uses: the router first,
    // then Formspree directly if the function is unavailable.
    let res;
    try {
      res = await fetch(CONFIG.leadRouterEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("lead-router " + res.status);
    } catch (routerErr) {
      console.error("Lead router failed, falling back to Formspree direct:", routerErr);
      res = await fetch(CONFIG.formspreeEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("Formspree " + res.status);
    }
    state.submitting = false;
    state.view = "success";
    clearDraft();
    render();
  } catch (err) {
    // Don't lose the borrower's work — keep them on the form, keep the draft,
    // and print the summary so it can be recovered manually if needed.
    console.error("Lead submission failed:", err);
    console.log(payload.leadSummary);
    state.submitting = false;
    state.submitError = t("submitErr");
    render();
  }
}

// ============================================================================
// BOOT
// ============================================================================
loadDraft();
if (state.view === "form" && !activeSteps().some(s => s.id === state.stepId)) {
  state.stepId = activeSteps()[0].id;
}
render();
</script>
</body>
</html>
